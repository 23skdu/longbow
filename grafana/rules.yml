        annotations:
          summary: "High off-heap arena usage"
          description: "Off-heap arena usage is {{ $value | humanizeBytes }}."

  - name: longbow_simd_kernel_alerts
    # An invisible kernel fallback was the failure mode the validation exists to
    # prevent. Only `reason="mismatch"` indicates a defect: a resolved SIMD kernel
    # disagreed with its scalar reference and was rejected in favour of the slower
    # path. `reason="unavailable"` is routine - it means no kernel is registered for
    # that type/metric/dims, which is expected outside the common widths.
    #
    # float32 used to take `unavailable` on every index, and this group said so.
    # It no longer does: float32's kernels were registered all along but unreachable,
    # because the five named kernel types in internal/simd/simd_types.go were defined
    # types rather than aliases and so failed the type assertion GetKernel uses. They
    # are aliases now, so float32 resolves and is validated like every other type.
    # A non-zero float32 fallback count from here on is therefore a real signal.
    rules:
      - alert: LongbowSIMDKernelMismatch
        expr: >-
          increase(longbow_hnsw_simd_kernel_fallbacks_total{reason="mismatch"}[30m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SIMD distance kernel for {{ $labels.element_type }} rejected as wrong"
          description: >-
            The {{ $labels.metric }} kernel for element type {{ $labels.element_type }}
            disagreed with its scalar reference and was rejected at index construction.
            The index is using the slower scalar path for this dtype, and the kernel
            itself is defective - it would otherwise feed wrong distances into
            neighbour selection and corrupt the graph quietly. The characteristic
            symptom before this metric existed was one dtype sitting far below its
            siblings at identical element count.

      - alert: LongbowSIMDKernelScalarFallbackRatio
        expr: >-
          sum by (element_type) (rate(longbow_hnsw_simd_kernel_resolved_total{outcome="scalar"}[1h]))
          /
          clamp_min(sum by (element_type) (rate(longbow_hnsw_simd_kernel_resolved_total[1h])), 0.001)
          > 0.99
          and on(element_type)
          sum by (element_type) (rate(longbow_hnsw_simd_kernel_resolved_total[1h])) > 0.001
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.element_type }} is running entirely on scalar distance math"
          description: >-
            More than 99% of distance resolutions for element type
            {{ $labels.element_type }} fell back to the scalar path over the last hour.
            If a SIMD kernel is expected for this type, this is a throughput problem
            with no other symptom. Do not dismiss this for float32: its kernels resolve
            and this alert firing on float32 means they stopped resolving, which is the
            exact failure that was silent for months.
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowSIMDKernelScalarFallbackRatio"

      - alert: LongbowJITKernelErrors
        expr: rate(longbow_jit_kernel_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SIMD JIT kernel compilation or execution error"
          description: "JIT vector math kernel failure detected at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowJITKernelErrors"

  - name: longbow_bulk_insert_alerts
    # Construction cost of HNSW bulk insert. These exist because bulk-insert
    # latency was charted but never alerted: a 250k turboquant build could run
    # for 45 minutes with nothing firing. See grafana/README.md.
    rules:
      - alert: LongbowBulkInsertDimensionErrors
        expr: rate(longbow_bulk_insert_dimension_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Bulk insert vector dimension mismatch"
          description: "Bulk insert rejected vectors due to dimension mismatch."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowBulkInsertDimensionErrors"

      # Thresholded at 300s, which is above the healthy band and below the point
      # where a build looks stuck. This only became expressible once the Go
      # histogram buckets were widened past 30s in internal/metrics; with the old
      # top bucket at 30 every slow build reported p95=+Inf and no threshold
      # could separate a 107s healthy build from one that never finishes.
      - alert: LongbowSlowBulkInsertByType
        expr: >-
          histogram_quantile(0.95,
            sum by (le, type) (rate(longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket[15m]))
          ) > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Slow HNSW bulk insert for type {{ $labels.type }}"
          description: >-
            P95 bulk insert latency for type {{ $labels.type }} is
            {{ $value | humanizeDuration }}. Reference for a healthy 250k-vector
            dim=128 build: float32 about 37s, turboquant 4-bit about 107s. This
            alert is set at 300s, so it fires well past the healthy band rather
            than merely noting that a quantised dtype costs more to build.
            Check batch size and worker count first.

      - alert: LongbowBulkInsertStalled
        expr: >-
          sum(rate(longbow_hnsw_bulk_insert_latency_by_type_seconds_count[15m])) == 0
          and longbow_index_queue_depth > 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "HNSW bulk insert stalled with a non-empty queue"
          description: >-
            No bulk insert has completed in 15 minutes while the indexing queue is
            non-empty. The job is still consuming resources but is not progressing.

      - alert: LongbowBulkInsertFasterThanFloat32
        expr: >-
          (
            histogram_quantile(0.95,
              sum by (le) (rate(longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant"}[30m]))
            )
            /
            histogram_quantile(0.95,
              sum by (le) (rate(longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="float32"}[30m]))
            )
          ) < 0.8
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "TurboQuant bulk insert is implausibly faster than float32"
          description: >-
            TurboQuant construction is running at {{ $value | humanize }}x float32.
            That is not an optimisation, it is the signature of the pre-a955a0c1
            defect: neighbour selection read the float32 arena, which is empty for
            every other element type, so every turboquant candidate was rejected and
            the graph was left partly disconnected. At 40k vectors that produced mean
            layer-0 degree 6.92 against an MMax0 of 16, with 27% of nodes unreachable.
            Investigate graph connectivity, not throughput.

      - alert: LongbowLowHNSWAverageDegree
        expr: >-
          min by (dataset) (longbow_hnsw_average_degree{level="0"}) < 8
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "HNSW layer-0 average degree is implausibly low for dataset {{ $labels.dataset }}"
          description: >-
            Mean layer-0 degree is {{ $value | humanize }} for dataset
            {{ $labels.dataset }}. A built HNSW graph sits close to its MMax0
            budget: the measured healthy value is 15.7 against MMax0=16, and ~31
            against the chart default MMax0=64. The threshold of 8 is set below
            the lowest degree budget in use (LONGBOW_LOW_MEM uses MMax0=32), so it
            should not fire on a healthy graph. The pre-a955a0c1 defect measured
            6.92, with 27% of nodes unreachable at any ef, which is what this
            catches. Check whether bulk insert completed, and whether
            LONGBOW_HNSW_BULK_CHAIN_LINKS is off.

  - name: longbow_hnsw_contention_alerts
    rules:
      - alert: LongbowHNSWUpdateContentionHigh
        expr: histogram_quantile(0.99, sum(rate(longbow_hnsw_update_contention_seconds_bucket[5m])) by (le)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HNSW update contention"
          description: "P99 update contention is {{ $value }}s, may impact write throughput."

      - alert: LongbowHNSWCoWCopiesHigh
        expr: rate(longbow_hnsw_cow_copy_count[5m]) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High CoW copy rate"
          description: "HNSW CoW copies at {{ $value }}/sec, index may be growing rapidly."

  - name: longbow_gpu_ingest_alerts
    rules:
      - alert: LongbowGPUIngestKernelSlow
        expr: histogram_quantile(0.99, sum(rate(longbow_gpu_ingest_kernel_duration_seconds_bucket[5m])) by (le)) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow GPU ingest kernel"
          description: "P99 GPU ingest kernel latency is {{ $value }}s."

      - alert: LongbowGPUNeighborPruneHigh
        expr: rate(longbow_gpu_neighbor_prune_ops_total[5m]) > 1000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High GPU neighbor prune rate"
          description: "GPU neighbor prune ops at {{ $value }}/sec, may indicate HNSW index churn."
