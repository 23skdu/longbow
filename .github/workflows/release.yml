name: Release
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   tags:
  #     - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Standard Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Standard Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for NVIDIA Image
        id: meta-nvidia
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-nvidia
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push NVIDIA Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.nvidia
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-nvidia.outputs.tags }}
          labels: ${{ steps.meta-nvidia.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for EMLGo CPU Image
        id: meta-emlgo-cpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-emlgo-cpu
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push EMLGo CPU Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.emlgo-cpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-emlgo-cpu.outputs.tags }}
          labels: ${{ steps.meta-emlgo-cpu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for EMLGo GPU Image
        id: meta-emlgo-gpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-emlgo-gpu
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push EMLGo GPU Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.emlgo-gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-emlgo-gpu.outputs.tags }}
          labels: ${{ steps.meta-emlgo-gpu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for TPU Image
        id: meta-tpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-tpu
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push TPU Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-tpu.outputs.tags }}
          labels: ${{ steps.meta-tpu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
