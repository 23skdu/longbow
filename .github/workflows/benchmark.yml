name: Continuous Benchmarks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run benchmarks on PR branch
        run: |
          # Run specific benchmark packages only
          go test -bench=BenchmarkEuclidean -benchmem -count=5 ./internal/simd/... 2>/dev/null | tee pr-simd-bench.txt
          go test -bench=BenchmarkSearch -benchmem -count=5 ./internal/store/... 2>/dev/null | tee pr-search-bench.txt
          go test -bench=BenchmarkArrowHNSWInsert -benchmem -count=5 ./internal/store/... 2>/dev/null | tee pr-insert-bench.txt

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Run benchmarks on main branch
        run: |
          cd main-branch
          go test -bench=BenchmarkEuclidean -benchmem -count=5 ./internal/simd/... 2>/dev/null | tee ../main-simd-bench.txt
          go test -bench=BenchmarkSearch -benchmem -count=5 ./internal/store/... 2>/dev/null | tee ../main-search-bench.txt
          go test -bench=BenchmarkArrowHNSWInsert -benchmem -count=5 ./internal/store/... 2>/dev/null | tee ../main-insert-bench.txt

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Compare SIMD benchmarks
        id: benchstat-simd
        run: |
          echo "## SIMD Benchmark Comparison" > bench-report.md
          echo "" >> bench-report.md
          echo "### Euclidean Distance" >> bench-report.md
          echo "\`\`\`" >> bench-report.md
          benchstat main-simd-bench.txt pr-simd-bench.txt 2>/dev/null >> bench-report.md || echo "No SIM benchmarks to compare" >> bench-report.md
          echo "\`\`\`" >> bench-report.md
          echo "" >> bench-report.md

      - name: Compare Search benchmarks
        id: benchstat-search
        run: |
          echo "## Search Benchmark Comparison" >> bench-report.md
          echo "" >> bench-report.md
          echo "\`\`\`" >> bench-report.md
          benchstat main-search-bench.txt pr-search-bench.txt 2>/dev/null >> bench-report.md || echo "No search benchmarks to compare" >> bench-report.md
          echo "\`\`\`" >> bench-report.md
          echo "" >> bench-report.md

      - name: Compare Insert benchmarks
        id: benchstat-insert
        run: |
          echo "## Insert Benchmark Comparison" >> bench-report.md
          echo "" >> bench-report.md
          echo "\`\`\`" >> bench-report.md
          benchstat main-insert-bench.txt pr-insert-bench.txt 2>/dev/null >> bench-report.md || echo "No insert benchmarks to compare" >> bench-report.md
          echo "\`\`\`" >> bench-report.md
          echo "" >> bench-report.md

      - name: Check for regressions
        id: check-regression
        run: |
          # Check for significant regressions (>5% slowdown)
          if benchstat main-simd-bench.txt pr-simd-bench.txt 2>/dev/null | grep -E "\+[6-9][0-9]\.[0-9]+%|\+[1-9][0-9][0-9]\.[0-9]+%"; then
            echo "regression=true" >> $GITHUB_OUTPUT
            echo "⚠️ **Warning: SIMD performance regression detected (>5% slowdown)**" >> bench-report.md
          elif benchstat main-insert-bench.txt pr-insert-bench.txt 2>/dev/null | grep -E "\+[6-9][0-9]\.[0-9]+%|\+[1-9][0-9][0-9]\.[0-9]+%"; then
            echo "regression=true" >> $GITHUB_OUTPUT
            echo "⚠️ **Warning: Insert performance regression detected (>5% slowdown)**" >> bench-report.md
          elif benchstat main-search-bench.txt pr-search-bench.txt 2>/dev/null | grep -E "\+[6-9][0-9]\.[0-9]+%|\+[1-9][0-9][0-9]\.[0-9]+%"; then
            echo "regression=true" >> $GITHUB_OUTPUT
            echo "⚠️ **Warning: Search performance regression detected (>5% slowdown)**" >> bench-report.md
          else
            echo "regression=false" >> $GITHUB_OUTPUT
            echo "✅ No significant performance regressions detected" >> bench-report.md
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bench-report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('## Benchmark Comparison')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

      - name: Fail on regression
        if: steps.check-regression.outputs.regression == 'true'
        run: |
          echo "::warning::Performance regression detected! Review benchmark results."
          exit 1
