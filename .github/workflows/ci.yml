name: CI Pipeline (Combined)

# Consolidated CI Pipeline combining:
# - Core Build, Cross-Compilation & Test Gates (formerly ci.yml)
# - Security Scanning (formerly security.yml: govulncheck, trivy)
# - Observability Conformance (formerly observability.yml: rules, metrics)
# - Helm Chart Validation (formerly helm-validation.yml: lint, template)
# - Markdown Linting (formerly markdown-lint.yml)
# - Benchmark Regression Gate (formerly benchmark.yml, benchmark-ab.yml)
#
# Server-side automatic triggers are disabled per repository policy;
# all gates can be run locally via `make ci` or specific Makefile targets.
# Server-side manual runs can be triggered via workflow_dispatch.

on:
  workflow_dispatch:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  validate:
    name: Build, Lint & Test Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Build all packages
        run: go build -v ./...

      - name: Build ADBC shared library
        run: go build -buildmode=c-shared -o liblongbow_adbc.so ./cmd/adbc

      - name: Verify generated SIMD is reproducible
        run: ./scripts/check_simd_generation.sh

      - name: Verify ARM64 cross-compilation
        run: |
          GOARCH=arm64 go build ./...
          GOARCH=arm64 go vet ./...

      - name: Run Unit Tests with Coverage (short mode)
        run: go test -v -short -coverprofile=coverage.txt ./...

      - name: Verify 100% Package Test Coverage Gate
        run: |
          UNTESTED=$(go test -list '.*' ./... 2>&1 | grep '\[no test files\]' || true)
          if [ -n "$UNTESTED" ]; then
            echo "::error::Found packages without tests:"
            echo "$UNTESTED"
            exit 1
          fi
          echo "All packages have active test coverage."

      - name: Test Benchmark Harness Helpers
        run: |
          python3 scripts/tests/test_benchmark_validation.py
          python3 scripts/tests/test_benchmark_memory.py
          python3 scripts/tests/test_benchmark_temporal.py
          python3 scripts/tests/test_benchmark_attribution.py
          python3 scripts/tests/test_ab_stats.py

  security:
    name: Security Analysis (govulncheck & trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: ./scripts/check_govuln.sh

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: vendor,data,bin

  observability:
    name: Observability & Metric Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Check metric inventory freshness
        run: |
          make observability-inventory
          if ! git diff --quiet -- internal/observability/testdata/registered_metrics.tsv; then
            echo "::error::internal/observability/testdata/registered_metrics.tsv is stale."
            echo "A metric was added, renamed or removed without running 'make observability-inventory'."
            git diff -- internal/observability/testdata/registered_metrics.tsv
            exit 1
          fi

      - name: Run metric conformance test suite
        run: go test -v ./internal/observability/...

      - name: Run promtool unit tests
        run: grafana/tests/test-rules.sh

  helm-and-docs:
    name: Helm Chart & Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.14.4

      - name: Helm Lint
        run: helm lint helm/longbow

      - name: Helm Template (Dry Run)
        run: helm template longbow helm/longbow --debug

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "docs/**/*.md"

  emulation:
    name: Hardware Emulation (ARM64 & Intel SDE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Run SIMD Tests under ARM64 Emulation
        run: GOARCH=arm64 go test -short -v ./internal/simd/...

  benchmark-regression:
    name: Benchmark Regression Verification
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true

      - name: Build benchmark binaries
        run: make build

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements.txt

      - name: Run fast Unified Benchmark (CI mode)
        run: |
          python3 scripts/unified_benchmark.py --ci --runs 3 \
            --compare-baseline benchmarks/baseline_cpu.json \
            --threshold 10

  release-containers:
    name: Build & Push Release Containers
    needs: [validate, security, observability, helm-and-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Standard Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Standard Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for NVIDIA Image
        id: meta-nvidia
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-nvidia
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push NVIDIA Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.nvidia
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-nvidia.outputs.tags }}
          labels: ${{ steps.meta-nvidia.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for EMLGo CPU Image
        id: meta-emlgo-cpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-emlgo-cpu
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push EMLGo CPU Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.emlgo-cpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-emlgo-cpu.outputs.tags }}
          labels: ${{ steps.meta-emlgo-cpu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for EMLGo GPU Image
        id: meta-emlgo-gpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-emlgo-gpu
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push EMLGo GPU Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.emlgo-gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-emlgo-gpu.outputs.tags }}
          labels: ${{ steps.meta-emlgo-gpu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for TPU Image
        id: meta-tpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-tpu
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push TPU Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-tpu.outputs.tags }}
          labels: ${{ steps.meta-tpu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
