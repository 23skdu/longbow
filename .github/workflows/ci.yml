name: CI Pipeline (Combined)

# Consolidated CI Pipeline combining:
# - Core Build, Cross-Compilation & Test Gates (formerly ci.yml)
# - Security Scanning (formerly security.yml: govulncheck, trivy)
# - Observability Conformance (formerly observability.yml: rules, metrics)
# - Helm Chart Validation (formerly helm-validation.yml: lint, template)
# - Markdown Linting (formerly markdown-lint.yml)
# - Benchmark Regression Gate (formerly benchmark.yml, benchmark-ab.yml)
#
# Server-side automatic triggers are disabled per repository policy;
# all gates can be run locally via `make ci` or specific Makefile targets.
# Server-side manual runs can be triggered via workflow_dispatch.

on:
  workflow_dispatch:
    inputs:
      secure_soak:
        description: Run the dispatch-only TLS/mTLS/encryption soak variants
        type: boolean
        default: false
      oidc_soak:
        description: Run the OIDC workload-identity soak (requires SOAK_OIDC_* repository variables)
        type: boolean
        default: false
      publish:
        description: Publish signed multi-arch release images (tag refs also publish automatically)
        type: boolean
        default: false
  # push:
  #   branches: [ main ]
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - 'benchmarks/**'
  # pull_request:
  #   branches: [ main ]
  #   paths-ignore:
  #     - '**.md'
  #     - 'docs/**'
  #     - 'benchmarks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  validate:
    name: Build, Lint & Test Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Check release version consistency
        run: ./scripts/check_version_consistency.sh

      - name: Build all packages
        run: go build -v ./...

      - name: Build ADBC shared library
        run: go build -buildmode=c-shared -o liblongbow_adbc.so ./cmd/adbc

      - name: Verify generated SIMD is reproducible
        run: ./scripts/check_simd_generation.sh

      - name: Enforce module size guardrails
        run: make module-size-check

      - name: Verify ARM64 cross-compilation
        run: |
          GOARCH=arm64 go build ./...
          GOARCH=arm64 go vet ./...

      - name: Run Unit Tests with Coverage (short mode)
        run: go test -v -short -coverprofile=coverage.txt ./...

      - name: Run Search Modes Accuracy & Performance Regression Gate
        run: make search-gate

      - name: Verify 100% Package Test Coverage Gate
        run: |
          UNTESTED=$(go test -list '.*' ./... 2>&1 | grep '\[no test files\]' || true)
          if [ -n "$UNTESTED" ]; then
            echo "::error::Found packages without tests:"
            echo "$UNTESTED"
            exit 1
          fi
          echo "All packages have active test coverage."

      - name: Verify 100% Package Fuzz Coverage Gate
        run: ./scripts/check_fuzz_coverage.sh

      - name: Check godoc coverage (advisory)
        continue-on-error: true
        run: make godoc-check

      - name: Test Benchmark Harness Helpers
        run: |
          python3 scripts/tests/test_benchmark_validation.py
          python3 scripts/tests/test_benchmark_memory.py
          python3 scripts/tests/test_benchmark_temporal.py
          python3 scripts/tests/test_benchmark_attribution.py
          python3 scripts/tests/test_ab_stats.py

      - name: Test RBAC Verification Script Helpers
        run: python3 scripts/tests/test_verify_rbac.py

      - name: Test Release Version Consistency Helpers
        run: python3 scripts/tests/test_version_consistency.py

  security:
    name: Security Analysis (govulncheck & trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: ./scripts/check_govuln.sh

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: vendor,data,bin

  oidc-federation-security:
    name: OIDC Federation Security Audit
    runs-on: ubuntu-latest
    needs: [validate, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Run OIDC federation security audit
        run: make sec-oidc

      - name: Run targeted OIDC federation tests
        run: go test -short -run 'OIDC|Federation|WebIdentity|WorkloadIdentity|JWKS' ./internal/security/... ./internal/store/... ./internal/middleware/...

  observability:
    name: Observability & Metric Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Check metric inventory freshness
        run: |
          make observability-inventory
          if ! git diff --quiet -- internal/observability/testdata/registered_metrics.tsv; then
            echo "::error::internal/observability/testdata/registered_metrics.tsv is stale."
            echo "A metric was added, renamed or removed without running 'make observability-inventory'."
            git diff -- internal/observability/testdata/registered_metrics.tsv
            exit 1
          fi

      - name: Run metric conformance test suite
        run: go test -v ./internal/observability/...

      - name: Check release artifact matrix (including ARM64 variants)
        run: ./scripts/check_observability.sh

      - name: Install promtool
        run: |
          PROM_VER="3.2.1"
          curl -sSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "prometheus-${PROM_VER}.linux-amd64/promtool"
          promtool --version

      - name: Run promtool unit tests
        run: grafana/tests/test-rules.sh

  helm-and-docs:
    name: Helm Chart & Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: v3.14.4

      - name: Helm Lint
        run: helm lint helm/longbow

      - name: Helm Template (Dry Run)
        run: helm template longbow helm/longbow --debug

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: ".markdownlint.json"
          globs: "docs/**/*.md"

  rbac-enforcement:
    name: RBAC Enforcement Verification
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Build Longbow
        run: go build -o /tmp/longbow-rbac ./cmd/longbow

      - name: Run RBAC-only verifier against a disposable server
        env:
          LONGBOW_RBAC_BOOTSTRAP_KEY: ci-rbac-admin-key-0123456789
          RBAC_URL: http://127.0.0.1:39092
        run: |
          set -euo pipefail
          DATA_DIR=$(mktemp -d)
          LOG_FILE=/tmp/longbow-rbac.log
          LONGBOW_LISTEN_ADDR=127.0.0.1:39090 \
          LONGBOW_META_ADDR=127.0.0.1:39091 \
          LONGBOW_METRICS_ADDR=127.0.0.1:39092 \
          LONGBOW_DATA_PATH="$DATA_DIR" \
          LONGBOW_MAX_MEMORY=1073741824 \
          LONGBOW_TESTING=true \
          LONGBOW_SECRETS_PROVIDER=file \
          LONGBOW_SECRETS_PATH="$DATA_DIR/rbac_secrets" \
            /tmp/longbow-rbac >"$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            rm -rf "$DATA_DIR"
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS "$RBAC_URL/ready" >/dev/null 2>&1; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$LOG_FILE"; exit 1; fi
            sleep 1
          done
          if ! curl -fsS "$RBAC_URL/ready" >/dev/null 2>&1; then cat "$LOG_FILE"; exit 1; fi
          LONGBOW_RBAC_VERIFY_URL="$RBAC_URL" python3 scripts/verify_rbac.py

  emulation:
    name: Hardware Emulation (ARM64 & Intel SDE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Run SIMD Tests under ARM64 Emulation
        run: GOARCH=arm64 go test -short -v -run='TestNEON|TestSVE|TestDispatch|TestCPU|TestEuclideanDistance$|TestCosineDistance$|TestDotProduct$' ./internal/simd/...

      - name: Run AVX-512 / VBMI SIMD coverage under Intel SDE
        run: bash scripts/check_avx512_coverage.sh

  benchmark-regression:
    name: Benchmark Regression Verification
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Build benchmark binaries
        run: make build

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements.txt

      - name: Run fast Unified Benchmark (CI mode)
        continue-on-error: true
        run: |
          python3 scripts/unified_benchmark.py --ci --runs 3 \
            --compare-baseline benchmarks/baseline_cpu.json \
            --threshold 10

  soak-quick:
    name: Bounded Soak (${{ matrix.variant }})
    needs: [validate, rbac-enforcement]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: shared-8-agents
            agents: 8
            per_namespace: 2
            duration: 10m
            port_offset: 0
            extra_args: ""
          - variant: permission-default
            agents: 3
            per_namespace: 0
            duration: 10m
            port_offset: 10
            extra_args: ""
          - variant: permission-scaled
            agents: 10
            per_namespace: 0
            duration: 10m
            port_offset: 20
            extra_args: ""
          - variant: federated
            agents: 2
            per_namespace: 0
            duration: 5m
            port_offset: 30
            extra_args: "-federated-only"
          - variant: analytics
            agents: 2
            per_namespace: 0
            duration: 10m
            port_offset: 40
            extra_args: "-workload dense=20,insert=10,pagerank=2,communities=2,graphrag=2,traverse=2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Build soak binaries
        run: |
          mkdir -p bin
          go build -o bin/longbow ./cmd/longbow
          go build -o bin/agentsoak ./cmd/agentsoak

      - name: Run ${{ matrix.variant }} soak
        env:
          LONGBOW_RBAC_BOOTSTRAP_KEY: ci-soak-admin-key-0123456789
        run: |
          set -euo pipefail
          PORT_BASE=$((31000 + ${{ matrix.port_offset }}))
          export LONGBOW_LISTEN_ADDR="127.0.0.1:${PORT_BASE}"
          export LONGBOW_META_ADDR="127.0.0.1:$((PORT_BASE + 1))"
          export LONGBOW_METRICS_ADDR="127.0.0.1:$((PORT_BASE + 2))"
          REPORT="artifacts/soak-${{ matrix.variant }}.json"
          scripts/run_bounded_soak.sh \
            --duration "${{ matrix.duration }}" \
            --agents "${{ matrix.agents }}" \
            --agents-per-namespace "${{ matrix.per_namespace }}" \
            --report "$REPORT" \
            ${{ matrix.extra_args }}

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ matrix.variant }}
          path: |
            artifacts/soak-${{ matrix.variant }}.json
            artifacts/soak-${{ matrix.variant }}.rss.jsonl
            artifacts/soak-${{ matrix.variant }}.server.log
          if-no-files-found: warn

  soak-secure:
    name: Secure Soak (${{ matrix.variant }})
    if: github.event_name == 'workflow_dispatch' && inputs.secure_soak
    needs: [validate, rbac-enforcement]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: tls
            require_client_cert: "false"
            encryption: "false"
            client_args: "-tls-enabled"
          - variant: mtls
            require_client_cert: "true"
            encryption: "false"
            client_args: "-tls-enabled -tls-cert {certs}/client.crt -tls-key {certs}/client.key"
          - variant: encrypted
            require_client_cert: "false"
            encryption: "true"
            client_args: ""
          - variant: combined
            require_client_cert: "true"
            encryption: "true"
            client_args: "-tls-enabled -tls-cert {certs}/client.crt -tls-key {certs}/client.key"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Build soak binaries
        run: |
          mkdir -p bin
          go build -o bin/longbow ./cmd/longbow
          go build -o bin/agentsoak ./cmd/agentsoak

      - name: Generate short-lived test certificates
        run: scripts/generate_test_certs.sh "$RUNNER_TEMP/soak-certs"

      - name: Run ${{ matrix.variant }} secure soak
        env:
          LONGBOW_RBAC_BOOTSTRAP_KEY: ci-soak-admin-key-0123456789
        run: |
          set -euo pipefail
          CERTS="$RUNNER_TEMP/soak-certs"
          PORT_BASE=32000
          export LONGBOW_LISTEN_ADDR="127.0.0.1:${PORT_BASE}"
          export LONGBOW_META_ADDR="127.0.0.1:$((PORT_BASE + 1))"
          export LONGBOW_METRICS_ADDR="127.0.0.1:$((PORT_BASE + 2))"
          export SOAK_SERVER_ENV="LONGBOW_TLS_ENABLED=true LONGBOW_TLS_CERT_FILE=$CERTS/server.crt LONGBOW_TLS_KEY_FILE=$CERTS/server.key LONGBOW_TLS_CA_FILE=$CERTS/ca.crt LONGBOW_TLS_MIN_VERSION=1.2 LONGBOW_TLS_REQUIRE_CLIENT_CERT=${{ matrix.require_client_cert }} LONGBOW_ENCRYPTION_AT_REST=${{ matrix.encryption }} LONGBOW_KMS_PROVIDER=local LONGBOW_KMS_MASTER_KEY=ci-soak-master-key-not-for-production"
          CLIENT_ARGS="${{ matrix.client_args }}"
          CLIENT_ARGS="${CLIENT_ARGS//\{certs\}/$CERTS}"
          REPORT="artifacts/soak-secure-${{ matrix.variant }}.json"
          # shellcheck disable=SC2086
          scripts/run_bounded_soak.sh \
            --duration 5m --agents 3 --report "$REPORT" $CLIENT_ARGS

      - name: Upload secure soak report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-secure-${{ matrix.variant }}
          path: |
            artifacts/soak-secure-${{ matrix.variant }}.json
            artifacts/soak-secure-${{ matrix.variant }}.rss.jsonl
            artifacts/soak-secure-${{ matrix.variant }}.server.log
          if-no-files-found: warn

  soak-oidc:
    name: OIDC Workload-Identity Soak
    if: github.event_name == 'workflow_dispatch' && inputs.oidc_soak
    needs: [validate, rbac-enforcement]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Check OIDC soak configuration
        run: |
          test -n "${{ vars.SOAK_OIDC_ISSUERS }}" || { echo "SOAK_OIDC_ISSUERS repository variable is required" >&2; exit 1; }
          test -n "${{ vars.SOAK_OIDC_AUDIENCE }}" || { echo "SOAK_OIDC_AUDIENCE repository variable is required" >&2; exit 1; }
          test -n "${{ vars.SOAK_OIDC_TOKEN_FILE_ENV }}" || { echo "SOAK_OIDC_TOKEN_FILE_ENV repository variable is required" >&2; exit 1; }

      - name: Build soak binaries
        run: |
          mkdir -p bin
          go build -o bin/longbow ./cmd/longbow
          go build -o bin/agentsoak ./cmd/agentsoak

      - name: Issue OIDC workload token
        shell: bash
        env:
          SOAK_OIDC_AUDIENCE: ${{ vars.SOAK_OIDC_AUDIENCE }}
          SOAK_OIDC_TOKEN_FILE_ENV: ${{ vars.SOAK_OIDC_TOKEN_FILE_ENV }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          env_name = os.environ["SOAK_OIDC_TOKEN_FILE_ENV"]
          if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", env_name):
              raise SystemExit("SOAK_OIDC_TOKEN_FILE_ENV is not a valid environment variable name")
          audience = os.environ["SOAK_OIDC_AUDIENCE"]
          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          query = urllib.parse.urlencode({"audience": audience})
          url = f"{request_url}{'&' if '?' in request_url else '?'}{query}"
          req = urllib.request.Request(
              url,
              headers={"Authorization": f"bearer {request_token}"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              token = json.load(response)["value"]
          if not token:
              raise SystemExit("OIDC token endpoint returned an empty token")
          token_path = pathlib.Path("artifacts/soak-oidc.jwt")
          token_path.parent.mkdir(parents=True, exist_ok=True)
          token_path.write_text(token, encoding="utf-8")
          token_path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"{env_name}={token_path.resolve()}\n")
          PY

      - name: Run OIDC workload-identity soak
        env:
          LONGBOW_RBAC_BOOTSTRAP_KEY: ci-soak-admin-key-0123456789
        run: |
          set -euo pipefail
          export LONGBOW_LISTEN_ADDR="127.0.0.1:33000"
          export LONGBOW_META_ADDR="127.0.0.1:33001"
          export LONGBOW_METRICS_ADDR="127.0.0.1:33002"
          export SOAK_SERVER_ENV="LONGBOW_OIDC_ENABLED=true LONGBOW_OIDC_ISSUERS='${{ vars.SOAK_OIDC_ISSUERS }}'"
          scripts/run_bounded_soak.sh \
            --duration 5m --agents 3 \
            --report artifacts/soak-oidc.json \
            -oidc-mode aws -oidc-audience "${{ vars.SOAK_OIDC_AUDIENCE }}" \
            -oidc-ttl 15m

      - name: Remove OIDC workload token file
        if: always()
        shell: bash
        run: rm -f artifacts/soak-oidc.jwt

      - name: Upload OIDC soak report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-oidc
          path: |
            artifacts/soak-oidc.json
            artifacts/soak-oidc.rss.jsonl
            artifacts/soak-oidc.server.log
          if-no-files-found: warn

  engine-memory-gate:
    name: Engine Bounded Memory Gate
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Run bounded-memory engine release gate
        run: make mem-engine-gate

  # Release container platform policy:
  #   * Dockerfile.cpu and Dockerfile.emlgo-cpu use golang:1.27.4-bookworm +
  #     scratch and publish linux/amd64 AND linux/arm64 multi-arch manifests.
  #   * Dockerfile.nvidia, Dockerfile.emlgo-nvidia: linux/amd64 only because the
  #     CUDA devel image installs a linux-amd64 Go toolchain and nvcc produces
  #     amd64-only kernels (no arm64 CUDA base/toolchain in this build).
  #   * TPU Docker builds (Dockerfile.tpu) were removed; TPU code remains
  #     unsupported/untested.
  #   * Dockerfile.metal is never published: Metal needs a native macOS host.
  #     OCI images are Linux artifacts; no darwin/arm64 image is published.
  # Publishing is opt-in: tag refs publish automatically, and workflow_dispatch
  # publishes only with `publish: true`. PRs/default dispatch stay build-only.
  release-containers:
    name: Build (and optionally publish) Release Containers
    needs: [validate, security, observability, helm-and-docs, oidc-federation-security, rbac-enforcement, soak-quick, engine-memory-gate, emulation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout emlgo dependency
        run: git clone https://github.com/23skdu/emlgo.git ../emlgo

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Vendor Go dependencies for Docker builds
        run: go mod vendor

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Standard Image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build local Standard Docker image for security scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cpu
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan

      - name: Run Trivy container image scan gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      # Local scan SBOM validates the amd64 build before publishing. Published
      # SBOMs (below) are generated from the actual pushed manifest digests.
      - name: Generate local scan SBOM (SPDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          format: spdx-json
          output-file: longbow-cpu-scan.spdx.json
          upload-artifact: false

      - name: Install Cosign for container signing
        uses: sigstore/cosign-installer@v3

      # Multi-arch: golang:1.27.4-bookworm and scratch support both slices.
      - name: Build (publish on tag/dispatch) Standard Docker image
        id: build-cpu
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.cpu
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for NVIDIA Image
        id: meta-nvidia
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-nvidia
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      # amd64-only: CUDA devel image installs a linux-amd64 Go toolchain and
      # nvcc emits amd64-only kernels; there is no arm64 CUDA base in this build.
      - name: Build (publish on tag/dispatch) NVIDIA Docker image (amd64-only)
        id: build-nvidia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.nvidia
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta-nvidia.outputs.tags }}
          labels: ${{ steps.meta-nvidia.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for EMLGo CPU Image
        id: meta-emlgo-cpu
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-emlgo-cpu
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      # Multi-arch: EMLGo CPU selects NEON kernels on arm64 and AVX2/AVX-512 on
      # amd64 from the same multi-arch golang base.
      - name: Build (publish on tag/dispatch) EMLGo CPU Docker image
        id: build-emlgo-cpu
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.emlgo-cpu
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta-emlgo-cpu.outputs.tags }}
          labels: ${{ steps.meta-emlgo-cpu.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for EMLGo GPU Image
        id: meta-emlgo-nvidia
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-emlgo-nvidia
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      # amd64-only: same CUDA/nvcc constraint as Dockerfile.nvidia.
      - name: Build (publish on tag/dispatch) EMLGo GPU Docker image (amd64-only)
        id: build-emlgo-nvidia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.emlgo-nvidia
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta-emlgo-nvidia.outputs.tags }}
          labels: ${{ steps.meta-emlgo-nvidia.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every check below is publish-only. The build steps above produce a
      # digest only when push=true, so verifying/signing by digest guarantees
      # we never sign a local, unpushed image.
      - name: Verify published manifests, tags and digests
        if: env.PUBLISH == 'true'
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CPU_DIGEST: ${{ steps.build-cpu.outputs.digest }}
          NVIDIA_DIGEST: ${{ steps.build-nvidia.outputs.digest }}
          EMLGO_CPU_DIGEST: ${{ steps.build-emlgo-cpu.outputs.digest }}
          EMLGO_NVIDIA_DIGEST: ${{ steps.build-emlgo-nvidia.outputs.digest }}
          CPU_TAGS: ${{ steps.meta.outputs.tags }}
          NVIDIA_TAGS: ${{ steps.meta-nvidia.outputs.tags }}
          EMLGO_CPU_TAGS: ${{ steps.meta-emlgo-cpu.outputs.tags }}
          EMLGO_NVIDIA_TAGS: ${{ steps.meta-emlgo-nvidia.outputs.tags }}
        run: |
          set -euo pipefail
          verify() {
            local label="$1" suffix="$2" digest="$3" arches="$4" tags="$5"
            if [[ -z "$digest" ]]; then
              echo "::error::${label}: no pushed digest (image was not published)"
              exit 1
            fi
            local ref="${REPO}${suffix}"
            local inspect
            inspect="$(docker buildx imagetools inspect "${ref}@${digest}")"
            for arch in $arches; do
              if ! grep -Eq "linux/${arch}([[:space:]]|$)" <<<"$inspect"; then
                echo "::error::${label}: linux/${arch} missing from manifest ${digest}"
                echo "$inspect"
                exit 1
              fi
            done
            # Every metadata tag must resolve to the exact manifest we sign.
            while IFS= read -r tag; do
              [[ -n "$tag" ]] || continue
              if ! docker buildx imagetools inspect "$tag" | grep -Fq "${digest}"; then
                echo "::error::${label}: ${tag} does not resolve to pushed digest ${digest}"
                exit 1
              fi
            done <<<"$tags"
            echo "${label}: ${ref}@${digest} (${arches}) verified"
          }
          verify "standard" "" "${CPU_DIGEST}" "amd64 arm64" "${CPU_TAGS}"
          verify "emlgo-cpu" "-emlgo-cpu" "${EMLGO_CPU_DIGEST}" "amd64 arm64" "${EMLGO_CPU_TAGS}"
          verify "nvidia" "-nvidia" "${NVIDIA_DIGEST}" "amd64" "${NVIDIA_TAGS}"
          verify "emlgo-nvidia" "-emlgo-nvidia" "${EMLGO_NVIDIA_DIGEST}" "amd64" "${EMLGO_NVIDIA_TAGS}"

      - name: Generate published Standard SBOM from pushed digest
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-cpu.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: longbow-cpu.spdx.json
          upload-artifact: false

      - name: Generate published EMLGo CPU SBOM from pushed digest
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-emlgo-cpu.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: longbow-emlgo-cpu.spdx.json
          upload-artifact: false

      - name: Generate published NVIDIA SBOM from pushed digest
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-nvidia.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: longbow-nvidia.spdx.json
          upload-artifact: false

      - name: Generate published EMLGo GPU SBOM from pushed digest
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-emlgo-nvidia.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: longbow-emlgo-nvidia.spdx.json
          upload-artifact: false

      - name: Sign published images with Cosign by pushed digest
        if: env.PUBLISH == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CPU_DIGEST: ${{ steps.build-cpu.outputs.digest }}
          NVIDIA_DIGEST: ${{ steps.build-nvidia.outputs.digest }}
          EMLGO_CPU_DIGEST: ${{ steps.build-emlgo-cpu.outputs.digest }}
          EMLGO_NVIDIA_DIGEST: ${{ steps.build-emlgo-nvidia.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$CPU_DIGEST" "$NVIDIA_DIGEST" "$EMLGO_CPU_DIGEST" \
            "$EMLGO_NVIDIA_DIGEST"; do
            if [[ -z "$digest" ]]; then
              echo "::error::refusing to sign an image without a pushed digest"
              exit 1
            fi
            echo "Signing ${REPO}@${digest}"
            cosign sign --yes "${REPO}@${digest}"
          done

      - name: Attach SBOMs to the pushed image digests
        if: env.PUBLISH == 'true'
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CPU_DIGEST: ${{ steps.build-cpu.outputs.digest }}
          NVIDIA_DIGEST: ${{ steps.build-nvidia.outputs.digest }}
          EMLGO_CPU_DIGEST: ${{ steps.build-emlgo-cpu.outputs.digest }}
          EMLGO_NVIDIA_DIGEST: ${{ steps.build-emlgo-nvidia.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attach sbom --sbom longbow-cpu.spdx.json "${REPO}@${CPU_DIGEST}"
          cosign attach sbom --sbom longbow-emlgo-cpu.spdx.json "${REPO}@${EMLGO_CPU_DIGEST}"
          cosign attach sbom --sbom longbow-nvidia.spdx.json "${REPO}@${NVIDIA_DIGEST}"
          cosign attach sbom --sbom longbow-emlgo-nvidia.spdx.json "${REPO}@${EMLGO_NVIDIA_DIGEST}"

  macos-15-verify:
    name: macOS-15 Runner Verification
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Install build dependencies
        run: brew install golangci-lint

      - name: Build all packages
        run: make build

      - name: Vet all packages
        run: make vet

      - name: Run Unit Tests (short mode)
        run: make test-short

      - name: Lint
        run: make lint

      - name: Enforce module size guardrails
        run: make module-size-check

  darwin-arm64-verify:
    name: ARM64 Darwin (Apple Silicon) Verification
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Build (darwin/arm64, CGO)
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -v ./...

      - name: Vet (darwin/arm64, CGO)
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go vet ./...

      - name: Test (darwin/arm64, CGO)
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go test -short ./...

      - name: Run ARM64 NEON verification suite
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go test -short ./internal/simd/...

      - name: Run Metal backend tests
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go test -short ./internal/gpu/... ./internal/gpu/metal/...

  release-darwin-arm64:
    name: Release Darwin ARM64 Artifacts
    needs: [validate, macos-15-verify, darwin-arm64-verify, soak-quick, engine-memory-gate, emulation]
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Build Darwin ARM64 binary
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/longbow-darwin-arm64 ./cmd/longbow

      - name: Upload Darwin ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: longbow-darwin-arm64
          path: dist/longbow-darwin-arm64
