{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "longbow.fullname" . }}-rules
  labels:
    {{- include "longbow.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
{{- (.Files.Get "grafana/rules.yml") | nindent 2 }}
{{- end }}
