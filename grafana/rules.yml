groups:
  - name: longbow_search_alerts
    rules:
      - alert: LongbowHighSearchLatency
        expr: histogram_quantile(0.99, sum by (le, dataset) (rate(longbow_vector_search_latency_seconds_bucket[5m]))) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High search latency on {{ $labels.dataset }}"
          description: "99th percentile search latency is above 1s for more than 2 minutes."

      - alert: LongbowGlobalSearchSlow
        expr: histogram_quantile(0.95, sum(rate(longbow_global_search_duration_seconds_bucket[5m])) by (le)) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow global search performance"
          description: "P95 global search latency exceeds 2 seconds."
  - name: longbow_hybrid_search_alerts
    rules:
      - alert: LongbowHybridSearchStalled
        # There is no `longbow_hybrid_search_enabled` gauge. Whether hybrid
        # search is actually in use is expressed by the per-dataset duration
        # histogram, which only exists for datasets that serve hybrid queries.
        # Gating on it keeps the alert from firing on every cluster that simply
        # does not use hybrid search.
        # `ignoring(dataset)` is required: the gate is labelled by dataset and
        # the activity counters carry none, so a default match on equal label
        # sets would never pair them up.
        expr: |
          max_over_time(longbow_hybrid_search_duration_seconds_count{dataset=~".+"}[24h]) > 0
            and ignoring(dataset) rate(longbow_hybrid_search_vector_total[5m]) == 0
            and ignoring(dataset) rate(longbow_hybrid_search_keyword_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hybrid search stalled"
          description: "Datasets served hybrid searches within the last 24h have processed no vector or keyword search for 5 minutes. Check that the hybrid search path is still scheduled."

      - alert: LongbowBM25IndexStalled
        # `or vector(0)` covers the case where the BM25 counter has never been
        # incremented at all, which otherwise yields no series and no alert at
        # all - the opposite of the intent.
        expr: |
          rate(longbow_hybrid_search_keyword_total[5m]) > 0
            and (rate(longbow_bm25_documents_indexed_total[5m]) or vector(0)) == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "BM25 indexing activity low"
          description: "Keyword searches are being served but no documents have been indexed to BM25 for 15 minutes. Hybrid results will be keyword-only."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowBM25IndexStalled"

      - alert: LongbowRerankerErrors
        expr: sum(rate(longbow_reranker_errors_total[5m])) by (type) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Hybrid search reranker error"
          description: "Cross-encoder or reciprocal rank fusion reranker failed on {{ $labels.type }}."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowRerankerErrors"

      - alert: LongbowGraphRAGExpansionErrors
        expr: sum(rate(longbow_graphrag_expansion_errors_total[5m])) by (dataset) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GraphRAG entity expansion error on {{ $labels.dataset }}"
          description: "Graph traversal expansion failed during hybrid GraphRAG query."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowGraphRAGExpansionErrors"

  - name: longbow_wal_alerts
    rules:
      - alert: LongbowHighWALQueueDepth
        expr: longbow_wal_pending_entries > 5000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High WAL queue depth"
          description: "WAL has {{ $value }} pending entries, indicating potential write backlog."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowHighWALQueueDepth"

      - alert: LongbowSlowWALFsync
        expr: histogram_quantile(0.99, sum(rate(longbow_wal_fsync_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow WAL fsync operations"
          description: "P99 WAL fsync duration exceeds 500ms, may indicate disk saturation."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowSlowWALFsync"

      - alert: LongbowWALWriteErrors
        expr: rate(longbow_wal_writes_total{status="error"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "WAL write errors detected"
          description: "WAL is encountering write errors at {{ $value }} per second."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowWALWriteErrors"

      - alert: LongbowWALFlushErrors
        expr: rate(longbow_wal_flush_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "WAL flush errors detected"
          description: "WAL buffer flush errors occurring at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowWALFlushErrors"

      - alert: LongbowWALDirectWriteErrors
        expr: rate(longbow_wal_write_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "WAL direct write errors detected"
          description: "WAL write failures occurring at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowWALDirectWriteErrors"

      - alert: LongbowCheckpointTimeouts
        expr: rate(longbow_checkpoint_timeouts_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "WAL checkpoint timeouts detected"
          description: "Checkpoint operations are timing out at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowCheckpointTimeouts"


  - name: longbow_index_alerts
    rules:
      - alert: LongbowIndexingLag
        expr: longbow_index_queue_depth > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High indexing queue depth"
          description: "The asynchronous indexing queue is growing faster than it can be processed."

      - alert: LongbowSlowIndexJobs
        expr: histogram_quantile(0.95, sum(rate(longbow_index_job_latency_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow index job processing"
          description: "P95 index job latency exceeds 10 seconds."

      - alert: LongbowIndexBuildFailures
        expr: sum by (type) (rate(longbow_index_creations_total{status="error"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Index build failures detected"
          description: "Indexes are failing to build at {{ $value }} per second."

      - alert: LongbowHighHNSWRepairDuration
        expr: histogram_quantile(0.99, sum(rate(longbow_hnsw_repair_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow HNSW repair cycles"
          description: "P99 HNSW repair duration exceeds 5 seconds."

      - alert: LongbowFrequentAdaptiveAdjustments
        expr: rate(longbow_hnsw_adaptive_adjustments_total[5m]) > 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High frequency of adaptive HNSW adjustments"
          description: "Adaptive HNSW parameters are changing frequently (> 0.5/sec)."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowFrequentAdaptiveAdjustments"

      - alert: LongbowIndexJobsDropped
        expr: rate(longbow_index_jobs_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Background index jobs dropped"
          description: "Indexing queue overflow is dropping jobs at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowIndexJobsDropped"

      - alert: LongbowNeighborSelectionErrors
        expr: sum(rate(longbow_neighbor_selection_errors_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Neighbor selection errors during indexing"
          description: "Errors encountered selecting graph neighbors at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowNeighborSelectionErrors"

      - alert: LongbowGraphF16ConversionErrors
        expr: sum(rate(longbow_graph_f16_conversion_errors_total[5m])) by (dataset) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Graph float16 conversion errors on {{ $labels.dataset }}"
          description: "Errors converting graph vectors to float16 occurring on dataset {{ $labels.dataset }}."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowGraphF16ConversionErrors"

  - name: longbow_mesh_alerts
    rules:
      - alert: LongbowMemberFailure
        expr: longbow_gossip_active_members < 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Mesh member count low"
          description: "Only {{ $value }} active members in mesh, expected 3+."

      - alert: LongbowSplitBrain
        expr: longbow_split_brain_healthy_peers < 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Split brain detected"
          description: "Cluster partition detected - healthy peer count is {{ $value }}."

      - alert: LongbowHighGossipFailures
        expr: rate(longbow_gossip_pings_total{direction="failed"}[5m]) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High gossip failure rate"
          description: "Gossip ping failures at {{ $value }} per second."

  - name: longbow_replication_alerts
    rules:
      - alert: LongbowHighReplicationLag
        expr: longbow_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High replication lag on {{ $labels.node }}"
          description: "Replication lag is {{ $value }} seconds behind."

      - alert: LongbowQuorumFailures
        expr: rate(longbow_quorum_failure_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Quorum write failures"
          description: "Quorum writes failing at {{ $value }} per second for {{ $labels.consistency }}."

      - alert: LongbowReplicationStalled
        expr: rate(longbow_replication_success_total[10m]) == 0 and rate(longbow_replication_failures_total[10m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Replication stalled"
          description: "No replication activity detected for 10 minutes."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowReplicationStalled"

      - alert: LongbowReplicationQueueDropped
        expr: rate(longbow_replication_queue_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Replication queue messages dropped"
          description: "Outbound replication queue is full; dropping messages at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowReplicationQueueDropped"

  - name: longbow_memory_alerts
    rules:
      - alert: LongbowMemoryPressure
        expr: longbow_memory_pressure_level > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory pressure"
          description: "Memory pressure level is {{ $value }}, may cause backpressure."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowMemoryPressure"

      - alert: LongbowFrequentBackpressure
        expr: rate(longbow_memory_backpressure_rejects_total[5m]) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Frequent memory backpressure rejections"
          description: "Rejecting {{ $value }} requests/sec due to memory pressure."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowFrequentBackpressure"

      - alert: LongbowMemoryFragmentation
        expr: longbow_memory_fragmentation_ratio > 1.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High memory fragmentation"
          description: "Memory fragmentation ratio is {{ $value }}, consider compaction."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowMemoryFragmentation"

      - alert: LongbowHighBackpressureRejections
        expr: rate(longbow_memory_backpressure_rejects_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory backpressure"
          description: "System is rejecting more than 5 requests/sec due to memory exhaustion."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowHighBackpressureRejections"

      - alert: LongbowMemoryLimitRejections
        expr: rate(longbow_memory_limit_rejects_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Requests rejected due to memory limits"
          description: "Hard memory limit reached; rejecting requests at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowMemoryLimitRejections"


  - name: longbow_performance_alerts
    rules:
      - alert: LongbowHighIpcErrors
        expr: sum by (type, error) (rate(longbow_hnsw_arrow_extraction_errors_total[5m])) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High IPC decoding error rate"
          description: "Encountering more than 1 IPC error per second."

      - alert: LongbowSlowFlightOps
        expr: histogram_quantile(0.99, sum(rate(longbow_flight_duration_seconds_bucket[5m])) by (le, method)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow Flight operations for {{ $labels.method }}"
          description: "P99 latency exceeds 5 seconds."

      - alert: LongbowGPUSlowSearch
        expr: histogram_quantile(0.99, sum(rate(longbow_vector_search_gpu_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow GPU search operations"
          description: "P99 GPU search latency exceeds 500ms."

      - alert: LongbowGPUFailure
        expr: sum(rate(longbow_vector_search_gpu_operations_total{status="error"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GPU acceleration failure"
          description: 'GPU-backed vector searches are reporting errors: {{ $value | humanize }} per second. Search falls back to CPU. Check longbow_gpu_fallback_total and longbow_gpu_device_temperature_celsius.'

      - alert: LongbowHighLockContention
        expr: histogram_quantile(0.95, sum(rate(longbow_dataset_lock_wait_duration_seconds_bucket[5m])) by (le, operation)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High lock contention on {{ $labels.operation }}"
          description: "P95 lock wait time exceeds 100ms."

  - name: longbow_compaction_alerts
    rules:
      - alert: LongbowCompactionStalled
        expr: rate(longbow_compaction_operations_total[10m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Compaction stalled"
          description: "No compaction activity for 30 minutes."

      - alert: LongbowFrequentAutoCompaction
        expr: rate(longbow_compaction_auto_triggers_total[5m]) > 0.1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Frequent auto-compaction triggers"
          description: "Auto-compaction triggering {{ $value }} times per second."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowFrequentAutoCompaction"

      - alert: LongbowCompactionErrors
        expr: rate(longbow_compaction_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Compaction errors detected"
          description: "Background index/vector compaction errors occurring at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowCompactionErrors"

  - name: longbow_recording_rules
    rules:
      - record: job:longbow_search_qps:rate5m
        expr: sum(rate(longbow_vector_search_latency_seconds_count[5m]))

      - record: job:longbow_put_qps:rate5m
        expr: sum(rate(longbow_flight_rows_processed_total{operation="put"}[5m]))

      - record: job:longbow_zero_copy_ratio:rate5m
        expr: sum(rate(longbow_do_get_zero_copy_total{type="zero_copy_retain"}[5m])) / (sum(rate(longbow_do_get_zero_copy_total[5m])) + 1)

      - record: job:longbow_quorum_success_rate:rate5m
        expr: sum(rate(longbow_quorum_success_total[5m])) / (sum(rate(longbow_quorum_success_total[5m])) + sum(rate(longbow_quorum_failure_total[5m])) + 1)

      - record: job:longbow_index_throughput:rate5m
        expr: sum(rate(longbow_index_job_latency_seconds_count[5m]))

  - name: longbow_s3_alerts
    rules:
      - alert: LongbowS3FailureRate
        expr: rate(longbow_s3_operations_total{status="error"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High S3 operation failure rate"
          description: "S3 operations failing at {{ $value }} per second."

      - alert: LongbowS3HighLatency
        expr: histogram_quantile(0.99, sum(rate(longbow_s3_request_duration_seconds_bucket[5m])) by (le, operation)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow S3 operations"
          description: "P99 S3 latency for {{ $labels.operation }} is above 2s."

  - name: longbow_system_alerts
    rules:
      - alert: LongbowBufferPoolSaturation
        expr: longbow_ipc_buffer_pool_utilization > 0.95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "IPC Buffer Pool Saturated"
          description: "IPC buffer pool utilization is at {{ $value | humanizePercentage }}, risk of allocation failures."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowBufferPoolSaturation"

      - alert: LongbowProcessPanics
        expr: sum(rate(longbow_panic_total[5m])) by (component) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Component panic recovered in {{ $labels.component }}"
          description: "Internal panic captured in component {{ $labels.component }}."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowProcessPanics"

      - alert: LongbowLogErrorsHigh
        expr: rate(longbow_log_errors_total[5m]) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Elevated error log rate"
          description: "Error-level log entries are being emitted at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowLogErrorsHigh"

      - alert: LongbowSemaphoreTimeouts
        expr: rate(longbow_semaphore_timeouts_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Concurrency semaphore timeouts"
          description: "Requests timing out waiting for concurrency semaphores at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowSemaphoreTimeouts"

  - name: longbow_distributed_alerts
    rules:
      - alert: LongbowCircuitBreakerTripped
        expr: rate(longbow_store_circuit_breaker_rejections_total[1m]) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker tripped"
          description: "Store circuit breaker is rejecting {{ $value }} requests/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowCircuitBreakerTripped"

      - alert: LongbowGlobalSearchPartialFailures
        expr: rate(longbow_global_search_partial_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Global search partial failures"
          description: "Global search is experiencing partial failures at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowGlobalSearchPartialFailures"

      - alert: LongbowVectorClockConflicts
        expr: rate(longbow_vector_clock_conflicts_total[1m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High vector clock conflict rate"
          description: "Vector clock conflicts exceeding 10/sec ({{ $value }})."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowVectorClockConflicts"

      - alert: LongbowSchemaColumnsDropped
        expr: rate(longbow_schema_columns_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Schema evolution dropping columns"
          description: "Schema column drop operations detected at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowSchemaColumnsDropped"


  - name: longbow_simd_alerts
    rules:
      - alert: LongbowSIMDDispatchSlow
        expr: histogram_quantile(0.95, sum(rate(longbow_hnsw_simd_dispatch_latency_seconds_bucket[5m])) by (le)) > 0.01
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "SIMD dispatch latency high"
          description: "SIMD kernel dispatch taking >10ms, may indicate dispatch overhead."

      - alert: LongbowSIMDFallback
        expr: rate(longbow_simd_fallback_total[5m]) > 10
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High SIMD fallback rate"
          description: "SIMD falling back to generic {{ $value }}/sec."

  - name: longbow_graph_navigation_alerts
    rules:
      - alert: LongbowGraphNavigationSlow
        expr: histogram_quantile(0.99, sum(rate(longbow_graph_navigation_latency_seconds_bucket[5m])) by (le)) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Graph navigation slow"
          description: "Graph path finding P99 taking >5s."

      - alert: LongbowGraphNavigationStalled
        expr: longbow_graph_navigation_operations_total == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Graph navigation stalled"
          description: "No graph navigation activity for 10 minutes."

  - name: longbow_rdma_alerts
    rules:
      - alert: LongbowRDMACriticalErrors
        expr: rate(longbow_rdma_errors_total[1m]) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RDMA critical errors"
          description: "RDMA errors occurring at {{ $value }}/sec."

      - alert: LongbowRDMANoActivity
        expr: longbow_rdma_bytes_processed_total == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "RDMA no activity"
          description: "RDMA enabled but no bytes processed for 15 minutes."

      - alert: LongbowTombstoneSaturation
        expr: (longbow_tombstones_total / longbow_hnsw_node_count) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High tombstone density"
          description: "Tombstones represent {{ $value | humanizePercentage }} of the index. Compaction recommended."

  - name: longbow_gpu_alerts
    rules:
      - alert: LongbowGPUMemoryPressure
        expr: sum by (device) (longbow_gpu_memory_bytes{type="allocated"}) / sum by (device) (longbow_gpu_memory_bytes{type="capacity"}) > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU memory pressure"
          description: "GPU memory utilization is above 90%."

      - alert: LongbowGPUIndexNotSynced
        expr: longbow_gpu_index_size < (longbow_hnsw_node_count * 0.9)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU index desync"
          description: "GPU index has fewer vectors than CPU index, sync may be failing."

      - alert: LongbowGPUFallbackHigh
        expr: rate(longbow_gpu_fallback_total[5m]) > 10
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High GPU fallback rate"
          description: "GPU operations falling back to CPU at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowGPUFallbackHigh"

      - alert: LongbowMultiGPUDeviceErrors
        expr: sum(rate(longbow_multi_gpu_device_errors[5m])) by (device) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Multi-GPU device error on {{ $labels.device }}"
          description: "Hardware device errors reported on GPU {{ $labels.device }}."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowMultiGPUDeviceErrors"

      - alert: LongbowONNXInferenceErrors
        expr: sum(rate(longbow_onnx_inference_errors_total[5m])) by (backend) > 0
