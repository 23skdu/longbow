{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "longbow.fullname" . }}
  labels:
    {{- include "longbow.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "longbow.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetSearchQPS }}
    - type: Pods
      pods:
        metric:
          name: longbow_search_requests_total_rate
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.targetSearchQPS }}
    {{- end }}
    {{- if .Values.autoscaling.targetSearchLatencyMs }}
    - type: Pods
      pods:
        metric:
          name: longbow_search_latency_seconds_p99
        target:
          type: AverageValue
          averageValue: {{ div .Values.autoscaling.targetSearchLatencyMs 1000 }}s
    {{- end }}
{{- end }}
