x-common-env: &common-env
  # Core
  LONGBOW_NODE_ID: node1
  LONGBOW_LOG_LEVEL: info
  LONGBOW_LISTEN_ADDR: 0.0.0.0:3000
  LONGBOW_META_ADDR: 0.0.0.0:3001
  LONGBOW_METRICS_ADDR: 0.0.0.0:9090
  LONGBOW_DATA_PATH: /data
  
  # HNSW & Indexing (Pragmas)
  LONGBOW_HNSW_M: 16
  LONGBOW_HNSW_EF_CONSTRUCTION: 200
  LONGBOW_HNSW_ALPHA: 1.2
  LONGBOW_HNSW_KEEP_PRUNED: "false"
  LONGBOW_USE_HNSW2: "true"
  LONGBOW_HNSW_SQ8_ENABLED: "false"
  LONGBOW_HNSW_FLOAT16_ENABLED: "false"
  
  # Memory & GC
  LONGBOW_MAX_MEMORY: 4294967296 # 4GB
  LONGBOW_GOGC: 100
  LONGBOW_GC_BALLAST_G: 1
  
  # Storage & Persistence
  LONGBOW_STORAGE_ASYNC_FSYNC: "true"
  LONGBOW_STORAGE_USE_DIRECT_IO: "false"
  LONGBOW_SNAPSHOT_INTERVAL: 1h
  LONGBOW_MAX_WAL_SIZE: 104857600 # 100MB
  
  # gRPC Tuning
  LONGBOW_GRPC_MAX_RECV_MSG_SIZE: 536870912
  LONGBOW_GRPC_MAX_SEND_MSG_SIZE: 536870912
  
  # Hybrid Search
  LONGBOW_HYBRID_SEARCH_ENABLED: "false"
  LONGBOW_HYBRID_TEXT_COLUMNS: text
  LONGBOW_HYBRID_ALPHA: 0.5

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
  interval: 30s
  timeout: 10s
  start_period: 5s
  retries: 3

x-common-service: &common-service
  container_name: longbow
  environment:
    <<: *common-env
    LONGBOW_GOSSIP_ENABLED: "false"
  ports:
    - "3000:3000"
    - "3001:3001"
    - "9090:9090"
  volumes:
    - ./data/longbow:/data
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    <<: *healthcheck
  restart: unless-stopped

services:
  # CPU-only (default profile)
  longbow:
    <<: *common-service
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile.cpu

  # NVIDIA CUDA GPU
  longbow-nvidia:
    <<: *common-service
    profiles: ["nvidia"]
    container_name: longbow-nvidia
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Apple Metal GPU
  longbow-metal:
    <<: *common-service
    profiles: ["metal"]
    container_name: longbow-metal
    build:
      context: .
      dockerfile: Dockerfile.metal

  # EMLGo CPU (SIMD math backend)
  longbow-emlgo-cpu:
    <<: *common-service
    profiles: ["emlgo-cpu"]
    container_name: longbow-emlgo-cpu
    build:
      context: .
      dockerfile: Dockerfile.emlgo-cpu

  # EMLGo GPU (SIMD math + CUDA)
  longbow-emlgo-gpu:
    <<: *common-service
    profiles: ["emlgo-gpu"]
    container_name: longbow-emlgo-gpu
    build:
      context: .
      dockerfile: Dockerfile.emlgo-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  default:
    name: longbow-net
    driver: bridge
