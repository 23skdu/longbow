x-common-env: &common-env
  # Core
  LONGBOW_NODE_ID: node1
  LONGBOW_LOG_LEVEL: info
  LONGBOW_LISTEN_ADDR: 0.0.0.0:3000
  LONGBOW_META_ADDR: 0.0.0.0:3001
  LONGBOW_METRICS_ADDR: 0.0.0.0:9090
  LONGBOW_DATA_PATH: /data
  LONGBOW_SNAPSHOT_PATH: /data/snapshots

  # HNSW & Indexing (Pragmas matching Helm chart)
  LONGBOW_HNSW_M: 32
  LONGBOW_HNSW_EF_CONSTRUCTION: 400
  LONGBOW_HNSW_ALPHA: 1.0
  LONGBOW_HNSW_KEEP_PRUNED: "false"
  LONGBOW_USE_HNSW2: "true"
  LONGBOW_HNSW_SQ8_ENABLED: "true"
  LONGBOW_HNSW_SQ4_ENABLED: "true"
  LONGBOW_HNSW_SQ2_ENABLED: "false"
  LONGBOW_HNSW_BQ_ENABLED: "false"
  LONGBOW_HNSW_FLOAT16_ENABLED: "true"
  LONGBOW_HNSW_PQ_ENABLED: "true"
  LONGBOW_HNSW_PQ_M: 16
  LONGBOW_HNSW_PQ_K: 256
  LONGBOW_HNSW_TURBOQUANT_ENABLED: "true"
  LONGBOW_HNSW_LEARNABLE_BITWIDTH_ENABLED: "true"
  LONGBOW_GEO_SEARCH_ENABLED: "true"
  LONGBOW_HNSW_REFINEMENT_FACTOR: 1.0
  LONGBOW_USE_DISK: "false"

  # Auto-Quantization Configuration
  LONGBOW_AUTO_QUANTIZE: "false"
  LONGBOW_AUTO_QUANTIZE_BITS: 8
  LONGBOW_AUTO_QUANTIZE_THRESHOLD: 10000

  # Adaptive Indexing & Sharding
  LONGBOW_INDEXING_ADAPTIVE_ENABLED: "false"
  LONGBOW_INDEXING_ADAPTIVE_THRESHOLD: 50000
  LONGBOW_ADAPTIVE_M_MAX_FACTOR: 1.5
  LONGBOW_MAX_M0: 32

  # Bulk Graph Quality & Navigation Pragmas (R8, R26)
  LONGBOW_HNSW_BULK_CHAIN_LINKS: "1"
  LONGBOW_HNSW_BULK_QUALITY_GUARD: "1"
  LONGBOW_HNSW_BULK_REACHABILITY_FLOOR: "0.80"
  LONGBOW_HNSW_BULK_MIN_DEGREE_RATIO: "0"
  LONGBOW_HNSW_BULK_MAX_HOP_DEPTH: "1.5"
  LONGBOW_HNSW_INBOUND_GUARD: "0"

  # Memory & GC
  LONGBOW_MAX_MEMORY: 4294967296 # 4GB
  LONGBOW_GOGC: 100
  LONGBOW_GC_BALLAST_G: 1
  LONGBOW_LAYER_EVICTION_ENABLED: "true"
  LONGBOW_LAYER_EVICTION_THRESHOLD: 0.75
  LONGBOW_AUTO_SPILL_DISK: "false"
  LONGBOW_SPILL_THRESHOLD_RATIO: "0.85"
  LONGBOW_LOW_MEM: "0"

  # Storage & Persistence
  LONGBOW_STORAGE_ASYNC_FSYNC: "true"
  LONGBOW_STORAGE_USE_DIRECT_IO: "false"
  LONGBOW_SNAPSHOT_INTERVAL: 1h
  LONGBOW_MAX_WAL_SIZE: 104857600 # 100MB
  LONGBOW_COMPACTION_ENABLED: "true"
  LONGBOW_COMPACTION_INTERVAL: 30s
  LONGBOW_STORAGE_USE_PARQUET_V2: "true"

  # Performance & Math Dispatch
  LONGBOW_PQ_INGEST: "0"
  LONGBOW_FLOAT64_EXCLUDE_EMLGO: "1"
  LONGBOW_MATH_DISPATCH: ""

  # gRPC Tuning (Matching Helm values: 20GB support)
  LONGBOW_GRPC_MAX_RECV_MSG_SIZE: 21474836470
  LONGBOW_GRPC_MAX_SEND_MSG_SIZE: 21474836470
  LONGBOW_GRPC_INITIAL_WINDOW_SIZE: 1048576
  LONGBOW_GRPC_INITIAL_CONN_WINDOW_SIZE: 1048576
  LONGBOW_GRPC_MAX_CONCURRENT_STREAMS: 250
  LONGBOW_GRPC_KEEPALIVE_TIME: 2h
  LONGBOW_GRPC_KEEPALIVE_TIMEOUT: 20s
  LONGBOW_GRPC_KEEPALIVE_MIN_TIME: 5m
  LONGBOW_GRPC_KEEPALIVE_PERMIT_WITHOUT_STREAM: "false"

  # Hybrid Search
  LONGBOW_HYBRID_SEARCH_ENABLED: "false"
  LONGBOW_HYBRID_TEXT_COLUMNS: text
  LONGBOW_HYBRID_ALPHA: 0.5

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
  interval: 30s
  timeout: 10s
  start_period: 5s
  retries: 3

x-common-service: &common-service
  container_name: longbow
  environment:
    <<: *common-env
    LONGBOW_GOSSIP_ENABLED: "false"
  ports:
    - "3000:3000"
    - "3001:3001"
    - "9090:9090"
  volumes:
    - ./data/longbow:/data
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  healthcheck:
    <<: *healthcheck
  restart: unless-stopped

services:
  # CPU-only (default profile)
  longbow:
    <<: *common-service
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile.cpu

  # NVIDIA CUDA GPU
  longbow-nvidia:
    <<: *common-service
    profiles: ["nvidia"]
    container_name: longbow-nvidia
    build:
      context: .
      dockerfile: Dockerfile.nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Apple Metal GPU
  longbow-metal:
    <<: *common-service
    profiles: ["metal"]
    container_name: longbow-metal
    build:
      context: .
      dockerfile: Dockerfile.metal

  # EMLGo CPU (SIMD math backend)
  longbow-emlgo-cpu:
    <<: *common-service
    profiles: ["emlgo-cpu"]
    container_name: longbow-emlgo-cpu
    build:
      context: .
      dockerfile: Dockerfile.emlgo-cpu

  # EMLGo GPU (SIMD math + CUDA)
  longbow-emlgo-gpu:
    <<: *common-service
    profiles: ["emlgo-gpu"]
    container_name: longbow-emlgo-gpu
    build:
      context: .
      dockerfile: Dockerfile.emlgo-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  default:
    name: longbow-net
    driver: bridge
