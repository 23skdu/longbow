name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Verify 100% Package Test Coverage Gate
        run: |
          UNTESTED=$(go test -list '.*' ./... 2>&1 | grep '\[no test files\]' || true)
          if [ -n "$UNTESTED" ]; then
            echo "::error::Found packages without tests:"
            echo "$UNTESTED"
            exit 1
          fi
          echo "All packages have active test coverage."

  benchmark-regression:
    name: Benchmark Regression (--ci)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - name: Build benchmark binaries
        run: make build

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements.txt

      - name: Run fast Unified Benchmark (CI mode)
        run: |
          python3 scripts/unified_benchmark.py --ci --runs 3 \
            --compare-baseline benchmarks/baseline_cpu.json \
            --threshold 10

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-benchmark-results
          path: data/perf_logs/perf_matrix_*.json
          retention-days: 14

