groups:
  - name: longbow_search_alerts
    rules:
      - alert: LongbowHighSearchLatency
        expr: histogram_quantile(0.99, sum by (le, dataset) (rate(longbow_vector_search_latency_seconds_bucket[5m]))) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High search latency on {{ $labels.dataset }}"
          description: "99th percentile search latency is above 1s for more than 2 minutes."

      - alert: LongbowGlobalSearchSlow
        expr: histogram_quantile(0.95, sum(rate(longbow_global_search_duration_seconds_bucket[5m])) by (le)) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow global search performance"
          description: "P95 global search latency exceeds 2 seconds."
  - name: longbow_hybrid_search_alerts
    rules:
      - alert: LongbowHybridSearchStalled
        expr: longbow_hybrid_search_enabled == 1 AND rate(longbow_hybrid_search_vector_total[5m]) == 0 AND rate(longbow_hybrid_search_keyword_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Hybrid search stalled"
          description: "Hybrid search is enabled but no vector or keyword searches have been processed for 5 minutes."

      - alert: LongbowBM25IndexStalled
        expr: longbow_hybrid_search_enabled == 1 AND rate(longbow_bm25_documents_indexed_total[5m]) == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "BM25 indexing activity low"
          description: "Hybrid search is enabled but no documents have been indexed to BM25 for 15 minutes."

  - name: longbow_wal_alerts
    rules:
      - alert: LongbowHighWALQueueDepth
        expr: longbow_wal_pending_entries > 5000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High WAL queue depth"
          description: "WAL has {{ $value }} pending entries, indicating potential write backlog."

      - alert: LongbowSlowWALFsync
        expr: histogram_quantile(0.99, sum(rate(longbow_wal_fsync_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow WAL fsync operations"
          description: "P99 WAL fsync duration exceeds 500ms, may indicate disk saturation."

      - alert: LongbowWALWriteErrors
        expr: rate(longbow_wal_writes_total{status="error"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "WAL write errors detected"
          description: "WAL is encountering write errors at {{ $value }} per second."

  - name: longbow_index_alerts
    rules:
      - alert: LongbowIndexingLag
        expr: longbow_index_queue_depth > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High indexing queue depth"
          description: "The asynchronous indexing queue is growing faster than it can be processed."

      - alert: LongbowSlowIndexJobs
        expr: histogram_quantile(0.95, sum(rate(longbow_index_job_latency_seconds_bucket[5m])) by (le)) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow index job processing"
          description: "P95 index job latency exceeds 10 seconds."

      - alert: LongbowIndexBuildFailures
        expr: rate(longbow_index_creation_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Index build failures detected"
          description: "Indexes are failing to build at {{ $value }} per second."

      - alert: LongbowHighHNSWRepairDuration
        expr: histogram_quantile(0.99, sum(rate(longbow_hnsw_repair_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow HNSW repair cycles"
          description: "P99 HNSW repair duration exceeds 5 seconds."

      - alert: LongbowFrequentAdaptiveAdjustments
        expr: rate(longbow_hnsw_adaptive_adjustments_total[5m]) > 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High frequency of adaptive HNSW adjustments"
          description: "Adaptive HNSW parameters are changing frequently (> 0.5/sec)."

  - name: longbow_mesh_alerts
    rules:
      - alert: LongbowMemberFailure
        expr: longbow_gossip_active_members < 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Mesh member count low"
          description: "Only {{ $value }} active members in mesh, expected 3+."

      - alert: LongbowSplitBrain
        expr: longbow_split_brain_healthy_peers < 1
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Split brain detected"
          description: "Cluster partition detected - healthy peer count is {{ $value }}."

      - alert: LongbowHighGossipFailures
        expr: rate(longbow_gossip_pings_total{direction="failed"}[5m]) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High gossip failure rate"
          description: "Gossip ping failures at {{ $value }} per second."

  - name: longbow_replication_alerts
    rules:
      - alert: LongbowHighReplicationLag
        expr: longbow_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High replication lag on {{ $labels.node }}"
          description: "Replication lag is {{ $value }} seconds behind."

      - alert: LongbowQuorumFailures
        expr: rate(longbow_quorum_failure_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Quorum write failures"
          description: "Quorum writes failing at {{ $value }} per second for {{ $labels.consistency }}."

      - alert: LongbowReplicationStalled
        expr: rate(longbow_replication_success_total[10m]) == 0 AND rate(longbow_replication_failure_total[10m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Replication stalled"
          description: "No replication activity detected for 10 minutes."

  - name: longbow_memory_alerts
    rules:
      - alert: LongbowMemoryPressure
        expr: longbow_memory_pressure_level > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory pressure"
          description: "Memory pressure level is {{ $value }}, may cause backpressure."

      - alert: LongbowFrequentBackpressure
        expr: rate(longbow_memory_backpressure_rejects_total[5m]) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Frequent memory backpressure rejections"
          description: "Rejecting {{ $value }} requests/sec due to memory pressure."

      - alert: LongbowMemoryFragmentation
        expr: longbow_memory_fragmentation_ratio > 1.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High memory fragmentation"
          description: "Memory fragmentation ratio is {{ $value }}, consider compaction."

      - alert: LongbowHighBackpressureRejections
        expr: rate(longbow_memory_backpressure_rejects_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory backpressure"
          description: "System is rejecting more than 5 requests/sec due to memory exhaustion."

  - name: longbow_performance_alerts
    rules:
      - alert: LongbowHighIpcErrors
        expr: rate(longbow_ipc_decode_errors_total[5m]) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High IPC decoding error rate"
          description: "Encountering more than 1 IPC error per second."

      - alert: LongbowSlowFlightOps
        expr: histogram_quantile(0.99, sum(rate(longbow_flight_duration_seconds_bucket[5m])) by (le, method)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow Flight operations for {{ $labels.method }}"
          description: "P99 latency exceeds 5 seconds."

      - alert: LongbowGPUSlowSearch
        expr: histogram_quantile(0.99, sum(rate(longbow_vector_search_gpu_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Slow GPU search operations"
          description: "P99 GPU search latency exceeds 500ms."

      - alert: LongbowGPUFailure
        expr: rate(longbow_vector_search_gpu_operations_total[5m]) == 0 AND longbow_gpu_enabled == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GPU acceleration failure"
          description: "GPU is enabled but no operations are being processed, may indicate driver or hang issue."

      - alert: LongbowHighLockContention
        expr: histogram_quantile(0.95, sum(rate(longbow_dataset_lock_wait_duration_seconds_bucket[5m])) by (le, operation)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High lock contention on {{ $labels.operation }}"
          description: "P95 lock wait time exceeds 100ms."

  - name: longbow_compaction_alerts
    rules:
      - alert: LongbowCompactionStalled
        expr: rate(longbow_compaction_operations_total[10m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Compaction stalled"
          description: "No compaction activity for 30 minutes."

      - alert: LongbowFrequentAutoCompaction
        expr: rate(longbow_compaction_auto_triggers_total[5m]) > 0.1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Frequent auto-compaction triggers"
          description: "Auto-compaction triggering {{ $value }} times per second."

  - name: longbow_recording_rules
    rules:
      - record: job:longbow_search_qps:rate5m
        expr: sum(rate(longbow_vector_search_latency_seconds_count[5m]))

      - record: job:longbow_put_qps:rate5m
        expr: sum(rate(longbow_flight_rows_processed_total{method="put"}[5m]))

      - record: job:longbow_zero_copy_ratio:rate5m
        expr: sum(rate(longbow_doget_zero_copy_total{type="zero_copy_retain"}[5m])) / (sum(rate(longbow_doget_zero_copy_total[5m])) + 1)

      - record: job:longbow_quorum_success_rate:rate5m
        expr: sum(rate(longbow_quorum_success_total[5m])) / (sum(rate(longbow_quorum_success_total[5m])) + sum(rate(longbow_quorum_failure_total[5m])) + 1)

      - record: job:longbow_index_throughput:rate5m
        expr: sum(rate(longbow_index_job_latency_seconds_count[5m]))

  - name: longbow_s3_alerts
    rules:
      - alert: LongbowS3FailureRate
        expr: rate(longbow_s3_operations_total{status="error"}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High S3 operation failure rate"
          description: "S3 operations failing at {{ $value }} per second."

      - alert: LongbowS3HighLatency
        expr: histogram_quantile(0.99, sum(rate(longbow_s3_request_duration_seconds_bucket[5m])) by (le, operation)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow S3 operations"
          description: "P99 S3 latency for {{ $labels.operation }} is above 2s."

  - name: longbow_system_alerts
    rules:
      - alert: LongbowBufferPoolSaturation
        expr: longbow_ipc_buffer_pool_utilization > 0.95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "IPC Buffer Pool Saturated"
          description: "IPC buffer pool utilization is at {{ $value | humanizePercentage }}, risk of allocation failures."

  - name: longbow_distributed_alerts
    rules:
      - alert: LongbowCircuitBreakerTripped
        expr: rate(longbow_store_circuit_breaker_rejections_total[1m]) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker tripped"
          description: "Store circuit breaker is rejecting {{ $value }} requests/sec."

      - alert: LongbowGlobalSearchPartialFailures
        expr: rate(longbow_global_search_partial_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Global search partial failures"
          description: "Global search is experiencing partial failures at {{ $value }}/sec."

      - alert: LongbowVectorClockConflicts
        expr: rate(longbow_vector_clock_conflicts_total[1m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High vector clock conflict rate"
          description: "Vector clock conflicts exceeding 10/sec ({{ $value }})."

  - name: longbow_simd_alerts
    rules:
      - alert: LongbowSIMDDispatchSlow
        expr: histogram_quantile(0.95, sum(rate(longbow_hnsw_simd_dispatch_latency_seconds_bucket[5m])) by (le)) > 0.01
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "SIMD dispatch latency high"
          description: "SIMD kernel dispatch taking >10ms, may indicate dispatch overhead."

      - alert: LongbowSIMDFallback
        expr: rate(longbow_simd_fallback_total[5m]) > 10
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High SIMD fallback rate"
          description: "SIMD falling back to generic {{ $value }}/sec."

  - name: longbow_graph_navigation_alerts
    rules:
      - alert: LongbowGraphNavigationSlow
        expr: histogram_quantile(0.99, sum(rate(longbow_graph_navigation_latency_seconds_bucket[5m])) by (le)) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Graph navigation slow"
          description: "Graph path finding P99 taking >5s."

      - alert: LongbowGraphNavigationStalled
        expr: longbow_graph_navigation_operations_total == 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Graph navigation stalled"
          description: "No graph navigation activity for 10 minutes."

  - name: longbow_rdma_alerts
    rules:
      - alert: LongbowRDMACriticalErrors
        expr: rate(longbow_rdma_errors_total[1m]) > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RDMA critical errors"
          description: "RDMA errors occurring at {{ $value }}/sec."

      - alert: LongbowRDMANoActivity
        expr: longbow_rdma_bytes_processed_total == 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "RDMA no activity"
          description: "RDMA enabled but no bytes processed for 15 minutes."

      - alert: LongbowTombstoneSaturation
        expr: (longbow_tombstones_total / longbow_hnsw_node_count) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High tombstone density"
          description: "Tombstones represent {{ $value | humanizePercentage }} of the index. Compaction recommended."

  - name: longbow_gpu_alerts
    rules:
      - alert: LongbowGPUMemoryPressure
        expr: longbow_gpu_memory_used_bytes / longbow_gpu_memory_total_bytes > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU memory pressure"
          description: "GPU memory utilization is above 90%."

      - alert: LongbowGPUIndexNotSynced
        expr: longbow_gpu_index_size < (longbow_hnsw_node_count * 0.9)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU index desync"
          description: "GPU index has fewer vectors than CPU index, sync may be failing."

      - alert: LongbowGPUFallbackHigh
        expr: rate(longbow_gpu_fallback_total[5m]) > 10
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High GPU fallback rate"
          description: "GPU operations falling back to CPU at {{ $value }}/sec."

  - name: longbow_adaptive_gc_alerts
    rules:
      - alert: LongbowAdaptiveGCHighGOGC
        expr: longbow_adaptive_gc_current_gogc > 500
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Adaptive GC targeting high GOGC"
          description: "Adaptive GC has increased GOGC to {{ $value }}, indicating high memory pressure."

      - alert: LongbowAdaptiveGCAllocationSpike
        expr: rate(longbow_adaptive_gc_allocation_rate_bytes_per_sec[1m]) > 1e9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Memory allocation spike"
          description: "Allocation rate exceeded 1GB/sec in the last minute."

  - name: longbow_storage_alerts
    rules:
      - alert: LongbowIOUringNotAvailable
        expr: longbow_storage_iouring_available == 0 AND ONGBOW_STORAGE_USE_IOURING == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "io_uring not available"
          description: "io_uring storage is enabled but not available on this system."

      - alert: LongbowHighIOWait
        expr: rate(longbow_storage_io_wait_seconds_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High I/O wait time"
          description: "I/O wait time is {{ $value }}/sec, indicating disk saturation."

  - name: longbow_pipeline_alerts
    rules:
      - alert: LongbowPipelineHighLatency
        expr: histogram_quantile(0.99, sum(rate(longbow_pipeline_duration_seconds_bucket[5m])) by (le, stage)) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow pipeline stage processing"
          description: "Pipeline stage {{ $labels.stage }} P99 duration exceeds 5 seconds."

  - name: longbow_temporal_alerts
    rules:
      - alert: LongbowTemporalIndexLag
        expr: rate(longbow_namespace_creation_total[5m]) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Temporal indexing activity detected"
          description: "New temporal records or namespaces created."

      # R11a. Before these counters existed, temporal cache behaviour could only be
      # inferred from latency. Each alert names its own remedy rather than just
      # reporting a number, because the two drop causes need opposite fixes.
      - alert: LongbowTemporalCacheLowHitRatio
        expr: |
          (
            sum(rate(longbow_temporal_cache_hits_total[5m]))
            /
            clamp_min(
              sum(rate(longbow_temporal_cache_hits_total[5m]))
              + sum(rate(longbow_temporal_cache_misses_total[5m])),
              1e-9
            )
          ) < 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Temporal as-of cache is missing most lookups"
          description: >-
            Hit ratio is {{ $value | humanizePercentage }}. Check which drop cause
            dominates: expiries mean the TTL is shorter than the reuse interval and
            should be raised; LRU evictions mean the cache is too small and should be
            grown.

      - alert: LongbowTemporalCacheCapacityEvicting
        expr: sum(rate(longbow_temporal_cache_evictions_total[5m])) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Temporal as-of cache is being resized away, not expiring"
          description: >-
            {{ $value | humanize }} capacity evictions/sec. Entries are being dropped
            because the LRU is full rather than because their TTL passed, so raising
            the TTL will not help; the cache size needs to increase.

  - name: longbow_layer_eviction_alerts
    rules:
      - alert: LongbowLayerEvictionHighErrorRate
        expr: rate(longbow_eviction_errors_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High layer eviction error rate"
          description: "Layer eviction/restore errors at {{ $value }}/sec on {{ $labels.dataset }}."

      - alert: LongbowLayerEvictionActiveLayersHigh
        expr: longbow_eviction_active_layers > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Many HNSW layers evicted"
          description: "{{ $value }} layers currently evicted on {{ $labels.dataset }}, may indicate memory pressure."

      - alert: LongbowLayerEvictionHeapPressure
        expr: longbow_eviction_heap_utilization > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High heap utilization triggering evictions"
          description: "Heap utilization at {{ $value | humanizePercentage }} when eviction triggered."

      - alert: LongbowLayerEvictionRestoreStalled
        expr: rate(longbow_eviction_layers_restored_total[10m]) == 0 AND longbow_eviction_active_layers > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Evicted layers not being restored"
          description: "Layers are evicted but none have been restored for 15 minutes, check for stale data."

  - name: longbow_slab_alerts
    rules:
      - alert: LongbowSlabPoolBufferHitRatioLow
        expr: longbow_slab_pool_buffer_hit_ratio < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low slab pool buffer hit ratio"
          description: "Slab pool buffer hit ratio is {{ $value | humanizePercentage }}, pool may be undersized."

      - alert: LongbowSlabPoolBoundaryViolations
        expr: rate(longbow_slab_pool_boundary_violations_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slab pool boundary violations detected"
          description: "Boundary violations at {{ $value }}/sec, may indicate memory corruption risk."

      - alert: LongbowSlabLeakProbabilityHigh
        expr: longbow_slab_leak_probability > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High slab leak probability"
          description: "Slab leak probability is {{ $value | humanizePercentage }}, investigate arena lifecycle."

  - name: longbow_arena_alerts
    rules:
      - alert: LongbowArenaNilErrors
        expr: rate(longbow_arena_nil_error_total[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Arena nil pointer errors"
          description: "Arena nil errors at {{ $value }}/sec for {{ $labels.operation }}."

      - alert: LongbowArenaOffHeapHigh
        expr: longbow_arena_off_heap_bytes > 10737418240
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High off-heap arena usage"
          description: "Off-heap arena usage is {{ $value | humanizeBytes }}."

  - name: longbow_simd_kernel_alerts
    # An invisible kernel fallback was the failure mode the validation exists to
    # prevent. Only `reason="mismatch"` indicates a defect: a resolved SIMD kernel
    # disagreed with its scalar reference and was rejected in favour of the slower
    # path. `reason="unavailable"` is routine - float32 alone takes it on every
    # index on an AVX2 host, because no float32 kernel is registered and its
    # fallback is itself an AVX2 dispatching kernel.
    rules:
      - alert: LongbowSIMDKernelMismatch
        expr: >-
          increase(longbow_hnsw_simd_kernel_fallbacks_total{reason="mismatch"}[30m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SIMD distance kernel for {{ $labels.element_type }} rejected as wrong"
          description: >-
            The {{ $labels.metric }} kernel for element type {{ $labels.element_type }}
            disagreed with its scalar reference and was rejected at index construction.
            The index is using the slower scalar path for this dtype, and the kernel
            itself is defective - it would otherwise feed wrong distances into
            neighbour selection and corrupt the graph quietly. The characteristic
            symptom before this metric existed was one dtype sitting far below its
            siblings at identical element count.

      - alert: LongbowSIMDKernelScalarFallbackRatio
        expr: >-
          sum by (element_type) (rate(longbow_hnsw_simd_kernel_resolved_total{outcome="scalar"}[1h]))
          /
          clamp_min(sum by (element_type) (rate(longbow_hnsw_simd_kernel_resolved_total[1h])), 0.001)
          > 0.99
          and on(element_type)
          sum by (element_type) (rate(longbow_hnsw_simd_kernel_resolved_total[1h])) > 0.001
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.element_type }} is running entirely on scalar distance math"
          description: >-
            More than 99% of distance resolutions for element type
            {{ $labels.element_type }} fell back to the scalar path over the last hour.
            If a SIMD kernel is expected for this type, this is a throughput problem
            with no other symptom. Ignore it for float32, which has no registered
            kernel on an AVX2 host and whose fallback is already SIMD.

  - name: longbow_bulk_insert_alerts
    # Construction cost of HNSW bulk insert. These exist because bulk-insert
    # latency was charted but never alerted: a 250k turboquant build could run
    # for 45 minutes with nothing firing. See docs/roadmap.md section 9.2.
    rules:
      # Thresholded at 300s, which is above the healthy band and below the point
      # where a build looks stuck. This only became expressible once the Go
      # histogram buckets were widened past 30s in internal/metrics; with the old
      # top bucket at 30 every slow build reported p95=+Inf and no threshold
      # could separate a 107s healthy build from one that never finishes.
      - alert: LongbowSlowBulkInsertByType
        expr: >-
          histogram_quantile(0.95,
            sum by (le, type) (rate(longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket[15m]))
          ) > 300
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Slow HNSW bulk insert for type {{ $labels.type }}"
          description: >-
            P95 bulk insert latency for type {{ $labels.type }} is
            {{ $value | humanizeDuration }}. Reference for a healthy 250k-vector
            dim=128 build: float32 about 37s, turboquant 4-bit about 107s. This
            alert is set at 300s, so it fires well past the healthy band rather
            than merely noting that a quantised dtype costs more to build.
            Check batch size and worker count first.

      - alert: LongbowBulkInsertStalled
        expr: >-
          sum(rate(longbow_hnsw_bulk_insert_latency_by_type_seconds_count[15m])) == 0
          and longbow_index_queue_depth > 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "HNSW bulk insert stalled with a non-empty queue"
          description: >-
            No bulk insert has completed in 15 minutes while the indexing queue is
            non-empty. The job is still consuming resources but is not progressing.

      - alert: LongbowBulkInsertFasterThanFloat32
        expr: >-
          (
            histogram_quantile(0.95,
              sum by (le) (rate(longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant"}[30m]))
            )
            /
            histogram_quantile(0.95,
              sum by (le) (rate(longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="float32"}[30m]))
            )
          ) < 0.8
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "TurboQuant bulk insert is implausibly faster than float32"
          description: >-
            TurboQuant construction is running at {{ $value | humanize }}x float32.
            That is not an optimisation, it is the signature of the pre-a955a0c1
            defect: neighbour selection read the float32 arena, which is empty for
            every other element type, so every turboquant candidate was rejected and
            the graph was left partly disconnected. At 40k vectors that produced mean
            layer-0 degree 6.92 against an MMax0 of 16, with 27% of nodes unreachable.
            Investigate graph connectivity, not throughput.

      - alert: LongbowLowHNSWAverageDegree
        expr: >-
          min by (dataset) (longbow_hnsw_average_degree{level="0"}) < 8
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "HNSW layer-0 average degree is implausibly low for dataset {{ $labels.dataset }}"
          description: >-
            Mean layer-0 degree is {{ $value | humanize }} for dataset
            {{ $labels.dataset }}. A built HNSW graph sits close to its MMax0
            budget: the measured healthy value is 15.7 against MMax0=16, and ~31
            against the chart default MMax0=64. The threshold of 8 is set below
            the lowest degree budget in use (LONGBOW_LOW_MEM uses MMax0=32), so it
            should not fire on a healthy graph. The pre-a955a0c1 defect measured
            6.92, with 27% of nodes unreachable at any ef, which is what this
            catches. Check whether bulk insert completed, and whether
            LONGBOW_HNSW_BULK_CHAIN_LINKS is off.

  - name: longbow_hnsw_contention_alerts
    rules:
      - alert: LongbowHNSWUpdateContentionHigh
        expr: histogram_quantile(0.99, sum(rate(longbow_hnsw_update_contention_seconds_bucket[5m])) by (le)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HNSW update contention"
          description: "P99 update contention is {{ $value }}s, may impact write throughput."

      - alert: LongbowHNSWCoWCopiesHigh
        expr: rate(longbow_hnsw_cow_copy_count[5m]) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High CoW copy rate"
          description: "HNSW CoW copies at {{ $value }}/sec, index may be growing rapidly."

  - name: longbow_gpu_ingest_alerts
    rules:
      - alert: LongbowGPUIngestKernelSlow
        expr: histogram_quantile(0.99, sum(rate(longbow_gpu_ingest_kernel_duration_seconds_bucket[5m])) by (le)) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow GPU ingest kernel"
          description: "P99 GPU ingest kernel latency is {{ $value }}s."

      - alert: LongbowGPUNeighborPruneHigh
        expr: rate(longbow_gpu_neighbor_prune_ops_total[5m]) > 1000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High GPU neighbor prune rate"
          description: "GPU neighbor prune ops at {{ $value }}/sec, may indicate HNSW index churn."
