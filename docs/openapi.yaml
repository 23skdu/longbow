openapi: 3.0.3
info:
  title: Longbow Vector Database API
  description: |
    High-performance vector database with Apache Arrow Flight protocol.
    Supports vector search, hybrid search, and distributed deployment.
  version: 0.1.9
  contact:
    name: Longbow Team
    url: https://github.com/23skdu/longbow
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: localhost:3000
    description: Longbow Data Server (Arrow Flight)
  - url: localhost:3001
    description: Longbow Meta Server (Arrow Flight)
  - url: localhost:9090
    description: Prometheus Metrics

tags:
  - name: Datasets
    description: Dataset management operations
  - name: Search
    description: Vector and hybrid search operations
  - name: Ingestion
    description: Data ingestion operations
  - name: Admin
    description: Administrative operations

paths:
  /:
    get:
      summary: List available datasets
      description: Returns a list of all available datasets via ListFlights
      operationId: listFlights
      tags:
        - Datasets
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatasetInfo'

  /dataset/{dataset}/search:
    post:
      summary: Execute vector search
      description: |
        Perform k-nearest neighbor search on a dataset.
        Supports filtering, hybrid search, and various parameters.
      operationId: vectorSearch
      tags:
        - Search
      parameters:
        - name: dataset
          in: path
          required: true
          schema:
            type: string
          example: my_dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /dataset/{dataset}/range:
    post:
      summary: Execute range search
      description: |
        Find all vectors within a similarity threshold.
        Returns all vectors where distance <= threshold.
      operationId: rangeSearch
      tags:
        - Search
      parameters:
        - name: dataset
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RangeSearchRequest'
      responses:
        '200':
          description: Range search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RangeSearchResponse'

  /dataset/{dataset}/hybrid:
    post:
      summary: Execute hybrid search
      description: |
        Combine dense vector search with sparse BM25 keyword search.
        Uses Reciprocal Rank Fusion (RRF) for result merging.
      operationId: hybridSearch
      tags:
        - Search
      parameters:
        - name: dataset
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HybridSearchRequest'
      responses:
        '200':
          description: Hybrid search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /dataset:
    post:
      summary: Create a new dataset
      description: Create a new dataset with specified schema and configuration
      operationId: createDataset
      tags:
        - Datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetRequest'
      responses:
        '201':
          description: Dataset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetInfo'

  /dataset/{dataset}:
    delete:
      summary: Delete a dataset
      description: Permanently delete a dataset and all its data
      operationId: deleteDataset
      tags:
        - Datasets
      parameters:
        - name: dataset
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Dataset deleted

  /namespace:
    post:
      summary: Create namespace
      description: Create a new namespace for tenant isolation
      operationId: createNamespace
      tags:
        - Datasets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceRequest'
      responses:
        '201':
          description: Namespace created

  /namespace/{namespace}/datasets:
    get:
      summary: List datasets in namespace
      description: List all datasets belonging to a specific namespace
      operationId: listDatasetsInNamespace
      tags:
        - Datasets
      parameters:
        - name: namespace
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of datasets
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      type: string

  /metrics:
    get:
      summary: Prometheus metrics
      description: Export Prometheus metrics for monitoring
      operationId: getMetrics
      tags:
        - Admin
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    DatasetInfo:
      type: object
      properties:
        name:
          type: string
        vectorType:
          type: string
          enum: [float32, float64, float16, int8, int16, int32, int64, uint8, uint16, uint32, uint64, complex64, complex128, turboquant]
        dimension:
          type: integer
        size:
          type: integer
          description: Number of vectors
        createdAt:
          type: string
          format: date-time

    SearchRequest:
      type: object
      required:
        - vector
        - k
      properties:
        vector:
          type: array
          items:
            type: number
            format: float32
          description: Query vector
        k:
          type: integer
          minimum: 1
          default: 10
          description: Number of results to return
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        efSearch:
          type: integer
          description: HNSW search parameter (16-4096)

    RangeSearchRequest:
      type: object
      required:
        - vector
        - threshold
      properties:
        vector:
          type: array
          items:
            type: number
            format: float32
        threshold:
          type: number
          format: float32
          description: Maximum distance threshold
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'

    HybridSearchRequest:
      type: object
      required:
        - k
      properties:
        vector:
          type: array
          items:
            type: number
            format: float32
        textQuery:
          type: string
          description: Text query for BM25 search
        k:
          type: integer
        alpha:
          type: number
          format: float32
          minimum: 0
          maximum: 1
          default: 0.5
          description: Weight for vector vs keyword (0=keyword, 1=vector)
        rrfK:
          type: integer
          default: 60
          description: RRF parameter
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        metadata:
          type: object
          properties:
            queryTime:
              type: number
              format: float32
              description: Query execution time in seconds

    RangeSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        count:
          type: integer
        metadata:
          type: object

    SearchResult:
      type: object
      properties:
        id:
          type: string
          format: uint64
        score:
          type: number
          format: float32
          description: Similarity score (higher is better)
        distance:
          type: number
          format: float32
          description: Distance (lower is better)
        metadata:
          type: object
          description: Associated metadata

    Filter:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte, in, contains, exists]
        value:
          type: string
        logic:
          type: string
          enum: [and, or, not]

    CreateDatasetRequest:
      type: object
      required:
        - name
        - dimension
      properties:
        name:
          type: string
        dimension:
          type: integer
        vectorType:
          type: string
          enum: [float32, float64, float16, int8, int16, int32, int64, uint8, uint16, uint32, uint64, complex64, complex128, turboquant]
          default: float32
        metric:
          type: string
          enum: [l2, cosine, dot]
          default: l2
        hnsw:
          $ref: '#/components/schemas/HNSWConfig'
        hybrid:
          $ref: '#/components/schemas/HybridConfig'

    HNSWConfig:
      type: object
      properties:
        m:
          type: integer
          default: 16
          description: Number of connections per node
        efConstruction:
          type: integer
          default: 64
          description: Build time search width
        efSearch:
          type: integer
          default: 64
          description: Query time search width

    HybridConfig:
      type: object
      properties:
        enabled:
          type: boolean
        alpha:
          type: number
          format: float32
        textColumns:
          type: array
          items:
            type: string

    NamespaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        options:
          type: object
          properties:
            maxDatasets:
              type: integer
            maxVectors:
              type: integer
