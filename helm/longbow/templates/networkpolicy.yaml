{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "longbow.fullname" . }}
  labels:
    {{- include "longbow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "longbow.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: longbow
      ports:
        - protocol: TCP
          port: {{ .Values.service.data.port }}
        - protocol: TCP
          port: {{ .Values.service.meta.port }}
        - protocol: TCP
          port: {{ .Values.metrics.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: longbow
      ports:
        - protocol: TCP
          port: {{ .Values.service.data.port }}
    - to: []  # allow DNS and external
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        {{- if .Values.oidc.enabled }}
        - protocol: TCP
          port: 443
        {{- end }}
{{- end }}
