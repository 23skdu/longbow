# Unit tests for longbow_gpu_alerts.
rule_files:
  - gpu_alerts.rules.yml

evaluation_interval: 1m

tests:
  # GPU memory low: no alerts
  - interval: 1m
    input_series:
      - series: 'longbow_gpu_memory_bytes{device="cuda:0",type="allocated"}'
        values: '1000x120'
      - series: 'longbow_gpu_memory_bytes{device="cuda:0",type="capacity"}'
        values: '10000x120'
      - series: 'longbow_gpu_fallback_total'
        values: '0x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: LongbowGPUMemoryPressure
        exp_alerts: []
      - eval_time: 30m
        alertname: LongbowGPUFallbackHigh
        exp_alerts: []

  # GPU Memory Pressure: memory at 95% of capacity -> fires after 2m
  - interval: 1m
    input_series:
      - series: 'longbow_gpu_memory_bytes{device="cuda:0",type="allocated"}'
        values: '9500x120'
      - series: 'longbow_gpu_memory_bytes{device="cuda:0",type="capacity"}'
        values: '10000x120'
    alert_rule_test:
      - eval_time: 1m
        alertname: LongbowGPUMemoryPressure
        exp_alerts: []
      - eval_time: 5m
        alertname: LongbowGPUMemoryPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              device: cuda:0
            exp_annotations:
              summary: "GPU memory pressure"
              description: "GPU memory utilization is above 90%."

  # Multi-GPU Device Error: error reported on cuda:1 -> fires after 1m
  - interval: 1m
    input_series:
      - series: 'longbow_multi_gpu_device_errors{device="cuda:1"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: LongbowMultiGPUDeviceErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              device: cuda:1
            exp_annotations:
              summary: "Multi-GPU device error on cuda:1"
              description: "Hardware device errors reported on GPU cuda:1."