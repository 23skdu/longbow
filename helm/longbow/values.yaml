replicaCount: 1

image:
  repository: ghcr.io/23skdu/longbow
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# gRPC Configuration
grpc:
  maxRecvMsgSize: "536870912" # 512MB (increased from 64MB for large dimension vectors)
  maxSendMsgSize: "536870912" # 512MB
  initialWindowSize: "1048576" # 1MB
  initialConnWindowSize: "1048576" # 1MB
  maxConcurrentStreams: 250
  keepAliveTime: "2h"
  keepAliveTimeout: "20s"
  keepAliveMinTime: "5m"
  keepAlivePermitWithoutStream: false

# Rate Limiting Configuration
rateLimit:
  rps: 0 # 0 = disabled
  burst: 0

# HNSW Index Configuration (Performance Tuning)
hnsw:
  m: 32
  efConstruction: 400
  alpha: 1.0
  keepPruned: false
  sq8Enabled: false
  bqEnabled: false
  pqEnabled: false
  turboQuantEnabled: false
  geoSearchEnabled: false
  float16Enabled: false
  refinementFactor: 1.0
  useDisk: false

# Compaction Configuration
compaction:
  enabled: true
  interval: "30s"
  targetBatchSize: 10000
  minBatches: 10

# Auto-Sharding Configuration
autoSharding:
  enabled: true
  threshold: 10000
  splitThreshold: 65536

# Ring Sharding Configuration
ringSharding:
  enabled: true

# Ingestion Worker Configuration
ingestion:
  workerCount: 0  # 0 = runtime.NumCPU()
  adaptiveBatching: true
  lockFreeQueue: true

# Storage I/O Configuration
storage:
  asyncFsync: true
  doPutBatchSize: 100
  useIOUring: false  # Requires Linux kernel with io_uring support
  useDirectIO: false
  useParquetV2: true

# Memory & GC Configuration
memory:
  evictionHeadroom: 0.10
  evictionPolicy: "lru"
  rejectWrites: true
  gcBallastGB: 0
  gogc: 100

# GPU Configuration
gpu:
  enabled: false
  deviceId: 0
  backend: "auto" # auto, cuda, metal

# RDMA (RoCEv2) Configuration
# Requires RDMA-capable NICs and libibverbs on the host.
rdma:
  enabled: false
  interface: "eth0"
  port: 3002

service:
  data:
    enabled: true
    type: ClusterIP
    port: 3000
    annotations: {}
  meta:
    enabled: true
    type: ClusterIP
    port: 3001
    annotations: {}

metrics:
  enabled: true
  port: 9090
  service:
    type: ClusterIP
    annotations: {}
  serviceMonitor:
    enabled: false

# Longbow configuration
config:
  maxMemory: "1073741824" # 1GB default
  maxWALSize: "104857600" # 100MB default
  snapshotInterval: "1h"
  ttl: "0s" # 0s = disabled
  logFormat: "json" # json or console
  logLevel: "info" # debug, info, warn, error
  nodeId: "" # Optional: set for specific node ID
  # Ingestion worker count (0 = runtime.NumCPU())
  ingestionWorkerCount: 0

# Hybrid Search Configuration
hybrid:
  enabled: false
  textColumns: "" # Comma-separated list of columns to index for keyword search
  alpha: 0.5 # Default weight (0.5 = equal dense/sparse)

# Gossip Mesh Configuration
# SWIM-based failure detection and membership protocol
gossip:
  enabled: true
  # Port for UDP gossip communication (one per pod)
  port: 7946
  # Protocol timing parameters
  protocolPeriod: "200ms" # How often to probe a random member
  interval: "200ms" # Added to satisfy config
  ackTimeout: "100ms" # Timeout for direct ping acknowledgment
  suspicionTimeout: "5s" # Time before suspect member marked dead
  advertiseAddr: "" # Set to Pod IP in K8s via downward API
  # Discovery configuration
  discovery:
    # Discovery provider: static, dns, or k8s
    provider: "k8s"
    # For static discovery: comma-separated list of seed nodes
    # Example: "longbow-0.longbow:7946,longbow-1.longbow:7946"
    staticPeers: ""
    # For k8s discovery: namespace and label selector
    namespace: "" # Empty = same namespace as pod
    labelSelector: "app.kubernetes.io/name=longbow"
    # For DNS discovery: SRV record to query
    dnsRecord: "_gossip._udp.longbow.default.svc.cluster.local"

# Sharding Configuration
sharding:
  ring:
    enabled: false
  auto:
    enabled: false
    threshold: 100
    splitThreshold: 1000

# Learned Index Configuration
# ML-based index selection using learned index predictors
learnedIndex:
  enabled: false
  minSamples: 100
  confidenceThreshold: 0.7
  updateInterval: "1h"

# SIMD Configuration
simd:
  implementation: "" # auto-detect: avx512, avx2, neon, generic
  fallbackEnabled: true
  jitEnabled: false

# PQ (Product Quantization) Configuration
pq:
  enabled: false
  m: 16
  k: 256
  minVectors: 1000

# ONNX / ML Inference & Reranking Configuration
ml:
  modelPath: ""
  tokenizerPath: ""
  runner: "wazero" # wazero, onnx, or quarrel
  onnx:
    libPath: "" # Path to libonnxruntime.so/dylib
  reranker:
    enabled: false
    type: "cross-encoder"
    topK: 10

# Adaptive Indexing Configuration
indexing:
  adaptive:
    enabled: true
    threshold: 1024
  workerPool:
    size: 0 # 0 = auto-detect CPU count

# ONNX Runtime Configuration (Legacy/Native)
onnx:
  enabled: false
  ep: "CPU" # CPU, CUDA, CoreML, TensorRT
  intraOpNumThreads: 0 # 0 = auto
  interOpNumThreads: 0 # 0 = auto

# Ollama Integration
# Local LLM server for embedding-based index prediction
ollama:
  enabled: false
  endpoint: "http://localhost:11434"
  model: "" # e.g., "nomic-embed-text:latest" or "qwen3-embedding:8b"
  timeout: 30

# Persistence configuration
persistence:
  wal:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    path: /data
  snapshots:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    path: /snapshots

# Change Data Capture (CDC) Configuration
cdc:
  enabled: false
  bufferSize: 1024
  asyncDispatch: true
  workerPoolSize: 4

# WebSocket Events Configuration
websocket:
  enabled: false
  port: 3002

# MQ Export Configuration (Kafka/Pulsar)
mq:
  enabled: false
  type: "kafka" # kafka or pulsar
  brokers: ""
  topic: ""
  batchSize: 100

# Temporal Versioning & Retention
temporal:
  enabled: false
  versionHistory: false
  maxVersions: 10
  retentionPeriod: "168h" # 7 days
  ttl:
    enabled: false
    default: "720h" # 30 days
  cleanupInterval: "1h"
  aggregation:
    enabled: false
    maxBuckets: 1000

# S3 Backend for Snapshots
# When enabled, snapshots are stored in S3-compatible storage
s3:
  enabled: false
  endpoint: "" # Leave empty for AWS S3, set for MinIO/R2
  bucket: "longbow-snapshots"
  prefix: "" # Optional key prefix (e.g., "prod/vectors")
  region: "us-east-1"
  usePathStyle: false # Set true for MinIO
  # Credentials - use existingSecret or provide directly (not recommended)
  existingSecret: ""
  existingSecretAccessKeyKey: "access-key-id"
  existingSecretSecretKeyKey: "secret-access-key"
  # Direct credentials (not recommended for production)
  accessKeyId: ""
  secretAccessKey: ""

# Ingress Configuration (Kubernetes Ingress)
ingress:
  data:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: longbow-data.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  meta:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: longbow-meta.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

# Gateway API (HTTPRoute) Configuration
# Modern alternative to Ingress - requires Gateway API CRDs
gatewayAPI:
  enabled: false
  # GatewayClass name (e.g., "istio", "traefik", "nginx")
  className: ""
  # Hostnames to route
  hostnames: []
  # TLS configuration
  tls:
    enabled: false
    secretName: ""
    # Or use Gateway TLS mode
    mode: "Terminate" # Terminate or Passthrough
  # Parent references for the route
  parentRefs: []
  # Rules for routing
  rules:
    - matches:
        - path:
            type: "PathPrefix"
            value: "/"
      backendRefs:
        - name: longbow-data
          port: 3000

# Cloudflare Tunnel Support
# Deploy cloudflared as sidecar to expose services via Cloudflare Tunnel
cloudflareTunnel:
  enabled: false
  # Cloudflare credentials secret (must contain tunnel-token or credentials.json)
  credentialsSecret: ""
  # Tunnel name (created via cloudflared tunnel create <name>)
  tunnelName: ""
  # Ingress rules for routing external traffic to services
  ingress:
    - service: http://longbow-data:3000
      originRequest:
        noTLSVerify: false
    - service: http://longbow-meta:3001
      originRequest:
        noTLSVerify: false
    - service: http://longbow-metrics:9090
      originRequest:
        noTLSVerify: false
  # Additional cloudflared configuration
  config:
    # Log level: debug, info, warn, error
    logLevel: "info"
    # Transport-loglevel: debug, info, warn, error
    transportLoglevel: "warn"
    # Retries for connection
    retries: 5
    # Grace period for draining connections
    gracePeriod: "30s"
  # Resource limits for cloudflared sidecar
  resources: {}

httpRoute:
  enabled: false
  gateway: {}
  hostnames: []
  rules: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetSearchQPS: 100 # Target QPS per pod before scaling up
  targetSearchLatencyMs: 200 # Target P99 latency in ms

nodeSelector: {}

tolerations: []

