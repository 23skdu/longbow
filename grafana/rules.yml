        expr: rate(longbow_onnx_metal_inference_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Apple Metal ONNX inference errors"
          description: "Metal ONNX acceleration failures occurring at {{ $value }}/sec."
          runbook_url: "https://github.com/23skdu/longbow/blob/main/docs/runbooks.md#LongbowONNXMetalInferenceErrors"

  - name: longbow_adaptive_gc_alerts
