      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="1"}'
        values: '0+0x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="5"}'
        values: '0+0x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="10"}'
        values: '0+9x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="30"}'
