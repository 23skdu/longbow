name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Build
        run: go build -v ./...

      - name: Verify generated SIMD is reproducible
        run: ./scripts/check_simd_generation.sh

      - name: Verify ARM64 still cross-compiles
        run: |
          GOARCH=arm64 go build ./...
          GOARCH=arm64 go vet ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.txt ./...

      - name: Test benchmark harness helpers
        # The benchmark report writer refuses to emit a report that violates
        # qps * p50 <= workers * 1000, which makes that report unusable as a
        # regression gate. That gate is only trustworthy if it is itself tested,
        # as is the memory-ceiling parser, the guarantee that the harness never
        # reaps processes it did not start, and the attribution of TurboQuant
        # bit depths and child exit signals in a report, and the decision rule
        # of the interleaved A/B harness that replaces the single-run gate.
        run: |
          python3 scripts/tests/test_benchmark_validation.py
          python3 scripts/tests/test_benchmark_memory.py
          python3 scripts/tests/test_benchmark_temporal.py
          python3 scripts/tests/test_benchmark_attribution.py
          python3 scripts/tests/test_ab_stats.py

      - name: Verify 100% Package Test Coverage Gate
        run: |
          UNTESTED=$(go test -list '.*' ./... 2>&1 | grep '\[no test files\]' || true)
          if [ -n "$UNTESTED" ]; then
            echo "::error::Found packages without tests:"
            echo "$UNTESTED"
            exit 1
          fi
          echo "All packages have active test coverage."

  test-arm64-emulation:
    name: Emulated ARM64 SIMD & Kernel Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Run SIMD Tests under ARM64 Emulation
        run: |
          GOARCH=arm64 go test -v ./internal/simd/...

  benchmark-regression:
    name: Benchmark Regression (--ci)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Build benchmark binaries
        run: make build

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements.txt

      - name: Run fast Unified Benchmark (CI mode)
        run: |
          python3 scripts/unified_benchmark.py --ci --runs 3 \
            --compare-baseline benchmarks/baseline_cpu.json \
            --threshold 10

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-benchmark-results
          path: data/perf_logs/perf_matrix_*.json
          retention-days: 14

