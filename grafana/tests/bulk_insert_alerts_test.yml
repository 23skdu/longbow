        values: '0+10x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="+Inf"}'
        values: '0+10x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_count{type="float32"}'
        values: '0+1x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="float32",le="1"}'
        values: '0+0x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="float32",le="5"}'
        values: '0+0x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="float32",le="10"}'
        values: '0+0x60'
