      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="120"}'
        values: '0+0x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="300"}'
        values: '0+0x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="900"}'
        values: '0+10x60'
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_bucket{type="turboquant",le="+Inf"}'
        values: '0+10x60'
      - series: 'longbow_hnsw_average_degree{dataset="ds1",level="0"}'
        values: '15.7x60'
      - series: 'longbow_index_queue_depth'
        values: '5x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: LongbowSlowBulkInsertByType
        exp_alerts:
          - exp_labels:
              alertname: LongbowSlowBulkInsertByType
              severity: warning
              type: turboquant
            exp_annotations:
              summary: "Slow HNSW bulk insert for type turboquant"
              description: >-
                P95 bulk insert latency for type turboquant is V. Reference for a healthy
                250k-vector dim=128 build: float32 about 37s, turboquant 4-bit about 107s.
                This alert is set at 300s, so it fires well past the healthy band rather
                than merely noting that a quantised dtype costs more to build. Check
                batch size and worker count first.
  - interval: 1m
    input_series:
      - series: 'longbow_hnsw_bulk_insert_latency_by_type_seconds_count{type="turboquant"}'
        values: '10x60'
      - series: 'longbow_hnsw_average_degree{dataset="ds1",level="0"}'
        values: '15.7x60'
      - series: 'longbow_index_queue_depth'
        values: '5x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: LongbowBulkInsertStalled
        exp_alerts:
          - exp_labels:
              alertname: LongbowBulkInsertStalled
              severity: critical
            exp_annotations:
              summary: "HNSW bulk insert stalled with a non-empty queue"
              description: >-
                No bulk insert has completed in 15 minutes while the indexing queue is
                non-empty. The job is still consuming resources but is not progressing.
